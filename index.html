td>\n<td>8<\/td>\n<td>8<\/td>\n<td>9<\/td>\n<td>8<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>The name gallery<\/h3>\n<p>Every team's name at the end of each Fantrax season, exactly as the archive has it.<\/p>\n<p><em>2017-18 was played before Fantrax. The only name on record from that season is the champion's: Austin's \"Size Doesn't Matter.\"<\/em><\/p>\n<table>\n<thead>\n<tr>\n<th>Owner<\/th>\n<th>2018-19<\/th>\n<th>2019-20<\/th>\n<th>2020-21<\/th>\n<th>2021-22<\/th>\n<th>2022-23<\/th>\n<th>2023-24<\/th>\n<th>2024-25<\/th>\n<th>2025-26<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Adam<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>Small Dong Dunkers<\/td>\n<td>Small Dong Dunkers<\/td>\n<td>Small Dong Dunkers<\/td>\n<td>Ball Is Life<\/td>\n<td>Ball Is Life<\/td>\n<\/tr>\n<tr>\n<td>Alex<\/td>\n<td>Jokes on you<\/td>\n<td>10th in power rankings<\/td>\n<td>10th in power rankings<\/td>\n<td>10th in power rankings<\/td>\n<td>10th in power rankings<\/td>\n<td>10th in power rankings<\/td>\n<td>10th in power rankings<\/td>\n<td>10th in power rankings<\/td>\n<\/tr>\n<tr>\n<td>Austin<\/td>\n<td>The Villain<\/td>\n<td>A New Hope<\/td>\n<td>Serious Jockic<\/td>\n<td>Stuck In The Middleton<\/td>\n<td>Ayton That A Bitch<\/td>\n<td>Crossover Cringle<\/td>\n<td>Crossover Cringle<\/td>\n<td>Crossover Cringle<\/td>\n<\/tr>\n<tr>\n<td>Brian<\/td>\n<td>Grant Touch This<\/td>\n<td>Wiggin Out<\/td>\n<td>KATManDo<\/td>\n<td>Ball is Life<\/td>\n<td>Ball is Life<\/td>\n<td>Goodie Mobley<\/td>\n<td>Goodie Mobley<\/td>\n<td>To the Victor Belong the Spoils<\/td>\n<\/tr>\n<tr>\n<td>Chase<\/td>\n<td>Go Basketball<\/td>\n<td>Go Basketball<\/td>\n<td>Go Basketball<\/td>\n<td>Go Basketball<\/td>\n<td>Go Basketball<\/td>\n<td>Go Basketball<\/td>\n<td>Go Basketball<\/td>\n<td>Go Basketball<\/td>\n<\/tr>\n<tr>\n<td>Jake<\/td>\n<td>Malice at the Palace<\/td>\n<td>Oladipo's Hoes<\/td>\n<td>We are NOT good<\/td>\n<td>Luka Skywalker<\/td>\n<td>Bennedict Energy<\/td>\n<td>Bennedict Energy<\/td>\n<td>Trash Pandas<\/td>\n<td>Trash Pandas<\/td>\n<\/tr>\n<tr>\n<td>Jordan<\/td>\n<td>Brodie &amp; Bron's Ballers<\/td>\n<td>RUSS-ian Interference<\/td>\n<td>F@%K The Stat Guy<\/td>\n<td>F The Got Damn Stat Guy<\/td>\n<td>Live. Laugh. Love. Luka.<\/td>\n<td>The Greek Shall Inherit the Earth.<\/td>\n<td>Injured Reserves<\/td>\n<td>Defending Champion<\/td>\n<\/tr>\n<tr>\n<td>Kendall<\/td>\n<td>All Em Rookies<\/td>\n<td>King Freaky Donc<\/td>\n<td>Fingers Crossed<\/td>\n<td>Ant Jemima<\/td>\n<td>Kendalllll<\/td>\n<td>Kendalllll-llll<\/td>\n<td>Kendalllllll<\/td>\n<td>Kenda-lllllllll<\/td>\n<\/tr>\n<tr>\n<td>Mark<\/td>\n<td>I Tried<\/td>\n<td>America's Team<\/td>\n<td>America's Team<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>Vaughn<\/td>\n<td>Malcolm in the Middleton<\/td>\n<td>Walk Harden<\/td>\n<td>Let's Talk About Sexton<\/td>\n<td>Brunson Burners<\/td>\n<td>Brunson Burners<\/td>\n<td>Brunson Burners<\/td>\n<td>Markkanen My Words<\/td>\n<td>Markkanen My Words<\/td>\n<\/tr>\n<tr>\n<td>Yow<\/td>\n<td>KAT Daddy's Brows and Beards<\/td>\n<td>The Zion King<\/td>\n<td>Definitely Not Jake's Team<\/td>\n<td>me and my best friend kevin<\/td>\n<td>Giddey Cheterosexuals<\/td>\n<td>JoelADDonLukaBo okStephAntKPJJJ<\/td>\n<td>El Niño Maravilla<\/td>\n<td>El Niño Maravilla<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>Sources: Fantrax league history, standings, schedules and playoff brackets for 2018-19 through 2025-26 (packet: <code>newsroom/packets/2026-10-19_league_history.json<\/code>, built by <code>scripts/build_league_history.py<\/code>); the commissioner's League Info ledger (\"Avg Finish Data\") for 2017-18 and the full 1-10 finish order. Regular-season records for 2019-20 include two late weeks that Fantrax counted in the standings when the season was suspended. Team names are each season's final name. Mid-season renames aren't in this archive.<\/em><\/p>"}, {"slug": "2026-10-19_big-man-theory", "title": "The Big Man Theory", "subtitle": "Brian asked for it, Chase made his case, and eight seasons of category results deliver the verdict on the longest-running strategy in Church League", "date": "2026-10-19", "desk": "The Historian", "html": "<p>Within an hour of \"Ten for Ten\" going up, Brian asked in the group chat for a deeper look at Chase's \"big man strategy\" over the years and how it stacks up against the rest of the league.<\/p>\n<p>Chase answered before the Historian could. His case, in short:<\/p>\n<ol>\n<li>Only two owners strictly build around bigs: him and Alex.<\/li>\n<li>That means less competition for the top big men.<\/li>\n<li>Whichever approach the league underuses is the easier one to execute.<\/li>\n<li>He targets five categories, which lets him punt the rest and be choosier about who he buys.<\/li>\n<\/ol>\n<p>Brian's reply: \"I prefer to read Claude's take.\"<\/p>\n<p>Here it is. The short version comes first, followed by the evidence.<\/p>\n<blockquote>\n<p><strong>The verdict:<\/strong> It's a real strategy, and Chase is the only owner who has made it work. It produced two titles and a 3rd-place finish. It also produced a 10th, another 10th, an 8th and a 6th. When it works, it wins titles. When it doesn't, the team finishes near the bottom. Across the whole league, big-man builds have done slightly <em>worse<\/em> than guard-heavy ones. And Chase's third title came from a team that wasn't big at all.<\/p>\n<\/blockquote>\n<hr />\n<h2>How the Historian measured \"big\"<\/h2>\n<p>Fantrax doesn't record anyone's strategy, but it does record which categories each team won. So every team-season gets a <strong>big index<\/strong>: how often it won rebounds, blocks and FG%, minus how often it won threes, assists and FT%. A team built on centers scores high (the maximum is +1). A team built on guards scores negative. A balanced team sits near zero.<\/p>\n<p>Points, steals and turnovers stay out of the index because both builds can win them.<\/p>\n<p>The index measures the results, not the intent. For the last four seasons it can be checked against actual rosters, and it holds up.<\/p>\n<hr />\n<h2>Claim 1: \"There are two of us that strictly go big.\" ✅ True<\/h2>\n<table>\n<thead>\n<tr>\n<th>Season<\/th>\n<th>Chase's big index<\/th>\n<th>League rank<\/th>\n<th>Alex's rank<\/th>\n<th>Chase's avg. centers rostered*<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>2018-19<\/td>\n<td>+.56<\/td>\n<td><strong>1st<\/strong><\/td>\n<td>3rd<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>2019-20<\/td>\n<td>+.83<\/td>\n<td><strong>1st<\/strong><\/td>\n<td>2nd<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>2020-21<\/td>\n<td>+.81<\/td>\n<td><strong>1st<\/strong><\/td>\n<td>2nd<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>2021-22<\/td>\n<td>+.45<\/td>\n<td>2nd<\/td>\n<td><strong>1st<\/strong><\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>2022-23<\/td>\n<td><strong>−.56<\/strong><\/td>\n<td><strong>10th<\/strong><\/td>\n<td><strong>1st<\/strong><\/td>\n<td>1.8<\/td>\n<\/tr>\n<tr>\n<td>2023-24<\/td>\n<td>+.67<\/td>\n<td><strong>1st<\/strong><\/td>\n<td>2nd<\/td>\n<td>8.1<\/td>\n<\/tr>\n<tr>\n<td>2024-25<\/td>\n<td>+.83<\/td>\n<td><strong>1st<\/strong><\/td>\n<td>2nd<\/td>\n<td>7.1<\/td>\n<\/tr>\n<tr>\n<td>2025-26<\/td>\n<td>+.71<\/td>\n<td><strong>1st<\/strong><\/td>\n<td>2nd<\/td>\n<td>8.6<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>*Average number of center-eligible players on the roster per day (IR excluded), from daily roster data that starts in 2022-23.<\/em><\/p>\n<p>Chase has been the league's biggest team in six of eight seasons. <strong>Alex has finished in the top three every single season.<\/strong> Nobody else shows up there consistently.<\/p>\n<p>So Chase has it right. It's a two-man club, and it has been for eight years.<\/p>\n<hr />\n<h2>Claim 4: \"I only target 5 categories.\" ✅ True, and that's both the strength and the risk<\/h2>\n<p>In his big seasons, Chase gives up the same categories almost every year: <strong>points, assists and threes, usually FT% too.<\/strong> He goes after rebounds, blocks, FG%, turnovers and steals.<\/p>\n<p>Punting four categories means the team has to win all five of the others, nearly every week. So the question is how often he actually does, and the table below makes the case better than any argument could.<\/p>\n<table>\n<thead>\n<tr>\n<th>Season<\/th>\n<th>Win rate in his 5 target categories<\/th>\n<th>Regular-season win %<\/th>\n<th>Finish<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>2019-20<\/td>\n<td><strong>.91<\/strong><\/td>\n<td>.824<\/td>\n<td>🏆 1st<\/td>\n<\/tr>\n<tr>\n<td>2020-21<\/td>\n<td><strong>.87<\/strong><\/td>\n<td>.692<\/td>\n<td>🏆 1st<\/td>\n<\/tr>\n<tr>\n<td>2024-25<\/td>\n<td><strong>.86<\/strong><\/td>\n<td>.533<\/td>\n<td>3rd<\/td>\n<\/tr>\n<tr>\n<td>2025-26<\/td>\n<td>.82<\/td>\n<td>.536<\/td>\n<td>6th<\/td>\n<\/tr>\n<tr>\n<td>2023-24<\/td>\n<td>.72<\/td>\n<td>.333<\/td>\n<td>8th<\/td>\n<\/tr>\n<tr>\n<td>2018-19<\/td>\n<td>.66<\/td>\n<td>.361<\/td>\n<td>10th<\/td>\n<\/tr>\n<tr>\n<td>2021-22<\/td>\n<td>.64<\/td>\n<td>.250<\/td>\n<td>10th<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>Win rate is the share of weeks he won each of rebounds, blocks, FG%, turnovers and steals, averaged across the five.<\/em><\/p>\n<p><strong>The numbers fall into three bands.<\/strong> When Chase wins his five categories close to 90% of the time, he wins the title. In the low-to-mid 80s, he's a playoff team. Below 75%, the four punted categories become four sure losses and the team falls into the bottom three. He has never landed between 75% and 82%.<\/p>\n<p>The rest of the record fits that. <strong>58% of Chase's wins have been 5-4 or closer, the highest share in the league<\/strong> (Jake's is the same, from far fewer wins). And only 12% of his losses were blowouts (2 categories or fewer), the lowest share in the league. A five-category team rarely wins big and rarely loses big. Nearly every week comes down to the swing category.<\/p>\n<hr />\n<h2>Claims 2 and 3: \"Less competition for bigs makes it easier.\" ❓ Unproven, and the data points to a different problem<\/h2>\n<p>There's no sign that the number of big-leaning teams in a season drives Chase's results. Two or three teams went big every season, including his title years and his 10th-place years.<\/p>\n<p>The real problem shows up when you sort his opponents. Here's Chase's regular-season record in his seven big seasons, by the opponent's build:<\/p>\n<table>\n<thead>\n<tr>\n<th>Opponent's build<\/th>\n<th>Chase's record<\/th>\n<th>Win %<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Other big-leaning teams<\/td>\n<td>12-9<\/td>\n<td>.571<\/td>\n<\/tr>\n<tr>\n<td>Balanced teams<\/td>\n<td>27-21-1<\/td>\n<td>.561<\/td>\n<\/tr>\n<tr>\n<td><strong>Guard-leaning teams<\/strong><\/td>\n<td><strong>13-23-1<\/strong><\/td>\n<td><strong>.365<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Guard-heavy teams beat the big-man build.<\/strong> Against a guard-heavy roster, Chase's four punted categories are lost before the week starts, and the opponent only needs to take one of his five. That's usually steals, where guards are strong.<\/p>\n<p>So the strategy really does have an edge against most of the league. But its natural opponent is the build it's least like, and Austin and Vaughn have been the most guard-heavy teams in the league for most of eight seasons.<\/p>\n<hr />\n<h2>The plot twist: the 2022-23 title wasn't a big-man team<\/h2>\n<p>In 2022-23, Chase had the <strong>least<\/strong> big team in the league. His big index was −.56, last of ten, and he averaged 1.8 centers on his roster. His most-used players that season: <strong>Nikola Jokic, Donovan Mitchell, Jayson Tatum, Kawhi Leonard, Kyrie Irving, Kevin Huerter, Jamal Murray<\/strong> and, later, <strong>Tyrese Haliburton.<\/strong> He won assists, threes, steals and FT% at least 75% of the time.<\/p>\n<p>That team went 12-4, took the #1 seed and won the title. He switched back to eight centers the next year.<\/p>\n<p>So the strategy behind two of Chase's titles is big men. The third came from Jokic and a lot of guards. If anything, the record says Chase is good at building around one clear idea, more than it says the idea has to be big men.<\/p>\n<hr />\n<h2>How it stacks up against the pack<\/h2>\n<p>Every team-season since 2018-19 (80 of them), split into three equal groups by big index:<\/p>\n<table>\n<thead>\n<tr>\n<th>Build<\/th>\n<th>Team-seasons<\/th>\n<th>Avg. regular-season win %<\/th>\n<th>Avg. finish<\/th>\n<th>Titles<\/th>\n<th>Top-3 finishes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Guard-leaning<\/td>\n<td>26<\/td>\n<td><strong>.565<\/strong><\/td>\n<td><strong>4.62<\/strong><\/td>\n<td>3<\/td>\n<td><strong>11<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Balanced<\/td>\n<td>26<\/td>\n<td>.479<\/td>\n<td>5.46<\/td>\n<td>3<\/td>\n<td>7<\/td>\n<\/tr>\n<tr>\n<td>Big-leaning<\/td>\n<td>28<\/td>\n<td>.460<\/td>\n<td>6.36<\/td>\n<td>2<\/td>\n<td>6<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>League-wide, <strong>going big has been the weakest of the three approaches,<\/strong> though not by a lot. The relationship between big index and winning is weak (correlation −0.15), so roster quality matters far more than build style. Both titles in the big-leaning group are Chase's (2019-20 and 2020-21).<\/p>\n<p>The big-leaning seasons by anyone <em>other<\/em> than Chase are rough: 15 of them, a .446 average win percentage and an average finish of 6.9. The best of them was Austin's 3rd place in 2022-23. Alex has been the league's other big-man owner for eight years, and his finishes have been 4th, 5th, 6th, 8th, 6th, 10th, 8th and 7th.<\/p>\n<p>Chase also has the <strong>most volatile finishes in the league:<\/strong> 10, 1, 1, 10, 1, 8, 3, 6. The spread of his finishes (standard deviation 3.7) is the highest of any owner. Austin's (0.6) is the lowest: top four every year, mostly with the opposite approach.<\/p>\n<hr />\n<h2>The verdict<\/h2>\n<p><strong>Brian's question: does it work?<\/strong> For Chase it does, sometimes, and when it works it wins titles. Two of his three titles came from the strategy, and nobody else has won anything with it. It also has the widest range of outcomes in the league, and the five target categories decide which way it goes: near 90% means a title, the low 80s means the playoffs, below 75% means the bottom three.<\/p>\n<p><strong>Chase's case:<\/strong> He's right that it's a two-man club, and right that the five-category approach is what makes it work. The \"less competition for bigs\" argument isn't supported by the data. His actual weakness isn't other big-man teams. It's guard-heavy teams, which beat him nearly two times out of three.<\/p>\n<p><strong>This season:<\/strong> The Analyst's preseason projections have this year's eight-center team 1st in rebounds, blocks, FG% and turnovers, and 10th in points, threes, assists and FT%. That's the purest version of the build Chase has ever drafted. The four target categories look secure, so the season probably comes down to the fifth: <strong>steals.<\/strong> In his two title seasons he won steals 94% and 69% of the time. In his three bottom-three seasons it was 50%, 56% and 27%.<\/p>\n<p>Watch the steals column.<\/p>\n<p><em>Sources: weekly category results for every regular-season matchup, 2018-19 through 2025-26 (<code>newsroom/packets/2026-10-19_league_history.json<\/code>); build profiles, opponent splits and margins (<code>newsroom/packets/2026-10-19_build_profiles.json<\/code>, built by <code>scripts/build_profiles.py<\/code>); daily rosters 2022-23 onward (FantraxDB <code>silver.roster_day<\/code>). Center eligibility uses current Fantrax positions. Finishes follow the League Info sheet.<\/em><\/p>"}, {"slug": "2026-10-17_season-preview", "title": "Eighty-Four Dollars", "subtitle": "The ceiling broke, Jake owns the Joker, Chase built a team of centers on purpose, and a full 1-through-10 prediction for 2026-27", "date": "2026-10-17", "desk": "The Analyst", "html": "<p>Ten days ago this column was called \"The $75 Ceiling,\" because nobody in this league had ever paid more than $75 for a player.<\/p>\n<p>Friday night, Jake paid $84 for Nikola Jokic.<\/p>\n<p>So much for the ceiling. Here's who I think wins it all, who finishes last, and what everyone built Friday night.<\/p>\n<hr />\n<h2>The predictions<\/h2>\n<p><strong>🏆 Champion: Jake, The Haliban.<\/strong> The best player in fantasy, a second top-6 player he kept for $11, and the league's best assist output by a mile.<\/p>\n<p><strong>🥈 Runner-up: Brian, Pursuit of Yaxellence.<\/strong> Four of BBM's top ten players. Nobody else has more than two.<\/p>\n<p><strong>🐴 Dark horse: Chase, Go Basketball.<\/strong> Eight centers, and the most deliberate build in the league. It's either a title or a meme, with no middle ground.<\/p>\n<p><strong>🪦 Last place: Austin, Crossover Cringle.<\/strong> Cade Cunningham and Trae Young are a lot of fun until you check the turnover column.<\/p>\n<h3>Full power rankings<\/h3>\n<p><em>\"Category win rate\" plays every team against every other team, one category at a time, using each team's top 10 players over BBM's projected games. It's the share of those category matchups a team wins. 50% is the middle. In H2H you need 5 of 9 categories to win a week, so anything over 55% is a team that should be in the race in most weeks.<\/em><\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Team<\/th>\n<th>Owner<\/th>\n<th>Category win rate (9-cat)<\/th>\n<th>Best at<\/th>\n<th>Worst at<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>The Haliban<\/td>\n<td>Jake<\/td>\n<td><strong>59%<\/strong><\/td>\n<td>Assists (1st), 3s, FT%<\/td>\n<td>FG% (8th), turnovers<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Pursuit of Yaxellence<\/td>\n<td>Brian<\/td>\n<td><strong>57%<\/strong><\/td>\n<td>Points (1st), blocks<\/td>\n<td>Assists (8th), FG%<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>El Niño Maravilla<\/td>\n<td>Yow<\/td>\n<td><strong>57%<\/strong><\/td>\n<td>Steals, FT% (2nd)<\/td>\n<td>Blocks (7th), points<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Go Basketball<\/td>\n<td>Chase<\/td>\n<td><strong>53%<\/strong><\/td>\n<td>Rebounds, blocks, FG%, turnovers (all 1st)<\/td>\n<td>Points, 3s, assists, FT% (all 10th)<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Markkanen My Words<\/td>\n<td>Vaughn<\/td>\n<td><strong>52%<\/strong><\/td>\n<td>Steals (1st)<\/td>\n<td>Points, rebounds (8th)<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Ball Is Life<\/td>\n<td>Adam<\/td>\n<td><strong>48%<\/strong><\/td>\n<td>Turnovers (2nd)<\/td>\n<td>Steals, 3s (8th)<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>Defending Champion<\/td>\n<td>Jordan<\/td>\n<td><strong>47%<\/strong><\/td>\n<td>3s, FT% (1st), assists<\/td>\n<td>Rebounds, blocks, FG%, turnovers (all 10th)<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>Kenda-lllllllll<\/td>\n<td>Kendall<\/td>\n<td><strong>46%<\/strong><\/td>\n<td>Points (2nd), rebounds<\/td>\n<td>Steals, FT%, turnovers (9th)<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>10th in power rankings<\/td>\n<td>Alex<\/td>\n<td><strong>43%<\/strong><\/td>\n<td>Rebounds, FG% (2nd)<\/td>\n<td>Steals (10th), assists, 3s<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Crossover Cringle<\/td>\n<td>Austin<\/td>\n<td><strong>38%<\/strong><\/td>\n<td>3s (2nd), assists<\/td>\n<td>FG%, blocks, rebounds (9th)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>The honest caveat:<\/strong> first to sixth is separated by about 11 points, and one Jokic ankle could reorder the whole thing. I tested the model counting each team's top 9 and top 12 players instead of 10. Jake stayed first and Austin stayed tenth every time, and Brian, Yow, Chase and Vaughn traded places in the 2-5 range. Treat the top and the bottom as real, and the middle as a coin flip.<\/p>\n<hr />\n<h2>The auction in five numbers<\/h2>\n<p><strong>$84.<\/strong> Jokic to Jake, the most anyone has ever paid in this league. The old record was $75 (Jokic, 2023), and Jokic has now been the most expensive player in four straight auctions: $75, $69, $71 and $84. His price had been drifting around $70 for three years before Friday. BBM projects 27.0 points, 13.5 rebounds and 10.6 assists on 55.8% shooting, so Jake isn't wrong about the player. He just paid $12 more than this room's usual price for the most expensive player of the year.<\/p>\n<p><strong>$54.<\/strong> Shai Gilgeous-Alexander, the first name nominated all night. He's BBM's #3 player (30.0 points on 54% shooting, 87% from the line, 2.2 turnovers), and he went for $30 less than Jokic and $7 less than Luka. In an auction, the first nomination often goes cheap while everyone is still holding their money. Vaughn knew that.<\/p>\n<p><strong>$121.<\/strong> What Kendall spent on Luka ($61) and Giannis ($60), 79% of everything he bought. The rest of his auction was mostly $1-2 players: Podziemski, Holiday, Hachimura and LaVine. That's stars and scrubs, by the book.<\/p>\n<p><strong>$1,220.<\/strong> Total auction spend, right in the normal range ($1,311, $1,120 and $1,186 the last three years). The money just went to the top this year. Five players went for $50 or more (Jokic, Luka, Giannis, SGA, Edwards), and 26 of the 79 buys went for $1-2.<\/p>\n<p><strong>$29.<\/strong> Chase left the most money unspent in the room. His most expensive buy was Anthony Davis at $46, and after that he never paid more than $12. That wasn't an accident (see \"Eight centers,\" below).<\/p>\n<hr />\n<h2>Steals and reaches<\/h2>\n<p><em>Each buy's price rank among the 79 players bought, against its BBM 9-cat rank among those same 79.<\/em><\/p>\n<p><strong>Steals<\/strong>\n- <strong>Payton Pritchard, $1 (Yow).<\/strong> The 78th-most expensive buy, and BBM's #64 player overall: 17.4 points, 2.8 threes, 87% from the line, 1.6 turnovers, 67 games. The best $1 in the auction.\n- <strong>Trae Young, $18 (Austin).<\/strong> BBM 9-cat #24, and #13 if you drop turnovers. That's 22.4 points and 9.9 assists in his first Washington season. Chase released him at a $59 keeper price, and the room let him go for less than a third of that.\n- <strong>Brandin Podziemski, $1 (Kendall).<\/strong> #74 overall, 16.1 points, 5.3 rebounds, 1.7 turnovers.\n- <strong>Keegan Murray, $2 (Brian).<\/strong> #73 overall, 34.5 minutes a game, with threes, blocks and steals.\n- <strong>CJ McCollum, $1 (Brian)<\/strong> and <strong>Jalen Suggs, $1 (Jake).<\/strong> Both are top-100 players, and Suggs projects 1.8 steals.<\/p>\n<p><strong>Reaches<\/strong>\n- <strong>Jarrett Allen, $34 (Alex).<\/strong> The 13th-most expensive buy, and BBM's #67 player. He's a fine player (15.9 points, 8.9 rebounds, 66% shooting), but $34 was priced like a top-20 player. Allen's $48 keeper price expired with Adam, and he came right back at $34 on a new contract.\n- <strong>Anthony Davis, $46 (Chase).<\/strong> The 7th-most expensive buy, BBM #44. The per-game numbers are elite (19.4 points, 11.0 rebounds, 1.8 blocks), but BBM projects only 53 games. Chase is paying for the per-game line and hoping for 65 games.\n- <strong>Norman Powell, $11 (Austin)<\/strong> and <strong>Fred VanVleet, $10 (Vaughn).<\/strong> BBM ranks them #113 and #121. VanVleet projects a 38.0% field-goal percentage.<\/p>\n<p><strong>The stash class of 2026.<\/strong> Jimmy Butler, $3 to Chase, went straight to IR. BBM projects 11 games, so he's a keeper play for next year at $8. Kristaps Porziņģis, $2 to Austin, projects 36 games. Adam kept Brandon Ingram ($15 cap hit this season) through a projected 35 games. Last year's stash class (Tatum, Haliburton, Kyrie) is now the core of the team I picked to win the title. Nobody in this room should ever laugh at a stash again.<\/p>\n<hr />\n<h2>Waiver week: tonight, tomorrow, Monday, Tuesday<\/h2>\n<p>The first waiver run is <strong>tonight at 6:15<\/strong>, with another <strong>Sunday at 6:15<\/strong>. Expect claims both nights and moves through Monday, because the first NBA games are <strong>Tuesday, October 20.<\/strong> Three things to know:<\/p>\n<p><strong>1. IR slots are roster spots in disguise.<\/strong> IR doesn't count toward the 14-man roster or the $350 cap, so every IR placement opens a spot for a free claim. Four teams have already used one, per this morning's Fantrax snapshot:<\/p>\n<table>\n<thead>\n<tr>\n<th>Team<\/th>\n<th>On IR<\/th>\n<th>The situation<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Jake<\/td>\n<td>Bam Adebayo<\/td>\n<td>Right groin tightness, three straight preseason games missed. The Heat open Wednesday 10/21 vs. Minnesota, and Erik Spoelstra has downplayed it.<\/td>\n<\/tr>\n<tr>\n<td>Alex<\/td>\n<td>Derrick White<\/td>\n<td>Sat out the preseason finale to <strong>rest<\/strong>, and is expected for Boston's opener Tuesday vs. Detroit.<\/td>\n<\/tr>\n<tr>\n<td>Alex<\/td>\n<td>AJ Dybantsa<\/td>\n<td>The #1 rookie pick, in an IR slot as of this morning.<\/td>\n<\/tr>\n<tr>\n<td>Chase<\/td>\n<td>Jimmy Butler<\/td>\n<td>The stash. He's not coming out of IR any time soon.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>2. The 24-hour rule.<\/strong> Once a player on IR plays an NBA game, his owner has <strong>24 hours from tip-off<\/strong> to activate him or drop him. White is the one to watch: if he plays Tuesday, Alex has until Wednesday night to make room on the roster for him. Whoever Alex claims this weekend to fill that spot has an expiration date.<\/p>\n<p><strong>3. Every claim costs $10 and comes with a 2029 contract.<\/strong> The league's default free-agent salary is $10, so every pickup counts $10 against the $350 cap. Contracts are also fixed: Fantrax's default for new acquisitions was set to 2028 for the auction and has been corrected to 2029, so a pickup made this weekend is on the same contract clock as an auction buy. Every team has room. The tightest is Kendall at $307 in cap hits.<\/p>\n<p><strong>Who's worth a claim<\/strong> (best players still unrostered, BBM 9-cat rank):\n- <strong>Jeremiah Fears, NOR (#86; #71 without turnovers).<\/strong> 15.4 points, 4.0 assists, 1.3 steals, 67 games. The best player on the wire.\n- <strong>Reed Sheppard, HOU (#94).<\/strong> 2.6 threes and 1.2 steals in 23.5 minutes. A cheap three-point boost for anyone short on 3s.\n- <strong>Ajay Mitchell, OKC (#105).<\/strong> Efficient (48.8% FG, 85.7% FT), 1.3 turnovers.\n- <strong>Paul Reed, DET (#111)<\/strong> and <strong>Jakob Poeltl, TOR (#116).<\/strong> Big-man streamers: Reed projects 1.1 steals and 1.1 blocks in 19 minutes, and Poeltl shoots 68.8%. Chase will want these two, and Chase already has eight centers.\n- <strong>Cedric Coward, MEM (#110).<\/strong> 15.3 points and 5.2 rebounds in 28 minutes. Jordan, this is your chance to finally roster a Grizzly.<\/p>\n<hr />\n<h2>How they built it<\/h2>\n<h3>1. Jake, The Haliban: two buys, and five years of homework<\/h3>\n<p>Jake spent <strong>$115 of his $121 on two players<\/strong>: Jokic ($84) and Bam Adebayo ($31). Five of his other buys cost $1-2 (Suggs, Dosunmu, Watson, DeRozan, Eason). That's only possible because of what he already had. <strong>Cooper Flagg<\/strong> (BBM #5, 24.5 points, 7.0 rebounds, 5.7 assists) costs him $11 this season, Tatum (#6, 27.0 points, 3.3 threes) $20, and Haliburton (9.2 assists) $23. Kyrie and Lillard are $15 each.<\/p>\n<p>The result leads the league in assists by more than 30 projected for the season, and ranks 3rd in threes and FT%. The weak spots are FG% (8th) and turnovers (7th), because Jokic's 3.7 a game are the price of the best fantasy player alive. Bam's groin is the only worry this week. Jake's a Pacers fan, and he still has a Pacer: Haliburton is back, and so, in spirit, is the $62 he paid for him in 2024.<\/p>\n<p><strong>Prediction: 1st.<\/strong> He has the best player, the best keepers, and he still won't be able to stop himself from trading for a Pacer in January.<\/p>\n<h3>2. Brian, Pursuit of Yaxellence: the Big Four<\/h3>\n<p>Brian bought <strong>Anthony Edwards ($50), Tyrese Maxey ($42) and Jalen Johnson ($37)<\/strong> and put them next to <strong>Victor Wembanyama<\/strong>, a $21 cap hit in the final season Brian can keep him. That's BBM's #2, #7, #8 and #10 players on one roster. He filled the rest with $1-3 players: Keegan Murray, Jabari Smith, McCollum, Vučević, John Collins and Wendell Carter.<\/p>\n<p>Brian ranks first in points, with Wemby's 3.5 blocks a game behind a 2nd-place finish in blocks. The weak spots are assists (8th) and FG% (7th). The bigger story: in the keeper preview, I called Wemby the league's best deadline trade chip <em>if Brian fell out of the race<\/em>. Brian is not falling out of the race. And the Hawks fan who calls them \"the most mediocre team in all of sports\" now owns the best Hawk (Johnson) and another one (McCollum) for $1.<\/p>\n<p><strong>Prediction: 2nd,<\/strong> and the only team that can beat Jake over a seven-game week of star play.<\/p>\n<h3>3. Yow, El Niño Maravilla: no holes, no stars<\/h3>\n<p>The defending champ spent <strong>the most money in the room ($156)<\/strong> and didn't buy a single player over $38. The result has <strong>eight players in BBM's top 50, the most in the league.<\/strong> That's Mitchell, Amen Thompson, Trey Murphy, Durant, Jalen Williams, Harden, Okongwu and Bane, plus Pritchard at $1.<\/p>\n<p>He's 2nd in steals and FT%, 4th in FG%, and no worse than 7th in anything. It's the balanced build, the opposite of Kendall's. It wins a lot of 5-4 weeks and very few 8-1 weeks. He can't punt anything, because he never built to.<\/p>\n<p><strong>Prediction: 3rd.<\/strong> Your commissioner, ladies and gentlemen. The Heckler has notes (see below).<\/p>\n<h3>4. Chase, Go Basketball: eight centers<\/h3>\n<p>Chase rosters <strong>Anthony Davis, Walker Kessler, Kel'el Ware, Rudy Gobert, Alex Sarr, Neemias Queta, Collin Murray-Boyles and Mitchell Robinson.<\/strong> That's eight bigs, and nobody else has more than five. It's the most deliberate punt build in the league.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Chase's rank<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Rebounds, blocks, FG%, turnovers<\/td>\n<td><strong>1st<\/strong> in all four<\/td>\n<\/tr>\n<tr>\n<td>Steals<\/td>\n<td>3rd (Dyson Daniels 2.0, Cason Wallace 1.9 a game)<\/td>\n<\/tr>\n<tr>\n<td>Points, threes, assists, FT%<\/td>\n<td>10th in all four<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Count that up: <strong>four category wins locked in every week, and steals is the swing fifth.<\/strong> H2H only needs five. His team FG% projects .538, the best in the league (Alex is next at .525, everyone else is .495 or lower), and his projected turnovers are 838 for the season when nobody else is under 1,190. His FT% (.706) is a disaster and doesn't matter, because he gave that category away on purpose.<\/p>\n<p>Kawhi (26.8 points on 49.8% shooting) is the only real scorer. The risk is the steals category: lose it in a given week and he loses 5-4. Bonus lore: <strong>Kel'el Ware<\/strong> (traded four times last year, ending up right back with Chase) is still on the roster, at a $16 cap hit.<\/p>\n<p><strong>Prediction: 4th,<\/strong> with the widest range of outcomes in the league. Watch Chase vs. Jordan in particular, the most extreme matchup on the schedule (see Jordan, below).<\/p>\n<h3>5. Vaughn, Markkanen My Words: SGA at a discount, and depth<\/h3>\n<p><strong>Twelve players in BBM's top 100, the most in the league.<\/strong> It starts with the auction's best star price, SGA at $54, and the cheap mid-tier keepers from last week's preview, at this season's cap hits: Buzelis $16, Edgecombe $11, Dejounte Murray $15, Keyonte George $13, Michael Porter Jr. $14 and Ausar Thompson $21. Then he bought Holmgren ($21) and Jaren Jackson ($27) for blocks.<\/p>\n<p>He's <strong>first in steals<\/strong> (Ausar 2.1, Dejounte 1.7, SGA 1.5, Edgecombe 1.5), but only 8th in points and rebounds. It's a deep team without a second star, and it's built to trade: there's surplus at guard to turn into a star later.<\/p>\n<p><strong>Prediction: 5th.<\/strong> The best trade candidate in the league, since he has depth to spare and contenders need it.<\/p>\n<h3>6. Adam, Ball Is Life: the middle of everything<\/h3>\n<p>Towns ($40), Mobley ($20), Booker ($18) and Franz Wagner ($13) joined Sengun, Markkanen and Alexander-Walker. Adam ranks between 5th and 8th in eight categories. The ninth is turnovers, where he's 2nd.<\/p>\n<p>It's a solid team with nothing that wins a week by itself. Ingram's 35 projected games, with Ingram in a regular roster spot, is a spot he'll want back. One IR move away from a claim.<\/p>\n<p><strong>Prediction: 6th.<\/strong> He's on the playoff line, and he'll need a trade to move above it.<\/p>\n<h3>7. Jordan, Defending Champion: the anti-Chase<\/h3>\n<p>Jordan's roster is the mirror image of Chase's: LaMelo ($27), Curry ($16), Brandon Miller ($20), Reaves, Jamal Murray and LeBron.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Jordan's rank<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Threes, FT%<\/td>\n<td><strong>1st<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Assists<\/td>\n<td>2nd<\/td>\n<\/tr>\n<tr>\n<td>Points<\/td>\n<td>3rd<\/td>\n<\/tr>\n<tr>\n<td>Rebounds, blocks, FG%, turnovers<\/td>\n<td><strong>10th<\/strong> in all four<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Four strong categories plus a fifth to find, which is the same math as Chase, flipped. He projects for 1,612 threes, about 270 more than anyone else, and Curry at 4.5 a game is the league's best threes source. Drop turnovers and his category win rate rises from 47% to 53%, because the punt is natural. He's punting it whether he admits it or not.<\/p>\n<p><strong>When Jordan plays Chase,<\/strong> expect something close to 4-4, with the week decided by steals. It's the most extreme matchup in the league, with no shared categories at all.<\/p>\n<p><strong>Prediction: 7th.<\/strong> Also: his team is named \"Defending Champion,\" and he is not the defending champion. Also: he roots for Memphis now and still has zero Grizzlies.<\/p>\n<h3>8. Kendall, Kenda-lllllllll: stars and scrubs<\/h3>\n<p>Luka ($61) projects 34.5 points, 4.3 threes and 8.8 assists. Giannis ($60) projects 30.6 points, 11.0 rebounds and 60.7% shooting. That's the best duo in the league by raw production.<\/p>\n<p>The problem is everything those two also do: <strong>4.0 and 3.4 turnovers a game<\/strong> and <strong>65.1% from the line for Giannis.<\/strong> Kendall is 9th in turnovers, steals and FT%, and he paid $121 for 2nd place in points and 3rd in rebounds and FG%. The supporting cast (Sabonis, Fox, Castle, Randle, Boozer) is fine, but it doesn't fix the leaks.<\/p>\n<p>The Hornets fan owns one Hornet, Kon Knueppel, and BBM has him missing the first two games.<\/p>\n<p><strong>Prediction: 8th,<\/strong> and the team that would most like a turnover-proof guard by Thanksgiving.<\/p>\n<h3>9. Alex, 10th in power rankings: center hoarding, ironically<\/h3>\n<p>Clingan, Duren, Jarrett Allen, Zubac and Edey: <strong>five centers<\/strong>, plus Derrick White, Giddey and Siakam. He's 2nd in rebounds and FG% (Duren shoots 65.8%), and <strong>last in steals.<\/strong> He's 9th in points, threes and assists. It's Chase's build without fully committing to the punt, so it ends up good at two categories instead of four.<\/p>\n<p>The team name is now also the prediction. Two IR slots are already taken (White, Dybantsa), so his waiver flexibility this weekend comes with the 24-hour rule attached.<\/p>\n<p><strong>Prediction: 9th.<\/strong> The #1 rookie pick (Dybantsa, 16.4 points projected) is the long game.<\/p>\n<h3>10. Austin, Crossover Cringle: the turnover tax<\/h3>\n<p>Austin spent every dollar, $124 on ten players, for Cade ($49), Trae ($18), Naz Reid ($17), Banchero ($13), Powell, Camara and a $2 Ja Morant. With Brunson and Avdija already kept, it's one of the best passing teams in the league (3rd in assists, 2nd in threes).<\/p>\n<p>The catch is that Cade (3.6), Trae (3.6), Avdija (3.4) and Banchero (3.3) are four of the league's heaviest turnover players on one roster. Add 9th in FG%, rebounds and blocks, and there aren't five categories to win in a typical week.<\/p>\n<p>And yes, <strong>Ja Morant is back<\/strong>: the league's most-traded paperweight went for $2. That's his sixth stop and fifth different owner in a year.<\/p>\n<p><strong>Prediction: 10th.<\/strong> This roster needs a trade (a big who shoots well and doesn't turn it over) more than any other.<\/p>\n<hr />\n<h2>The Heckler's desk<\/h2>\n<p><em>(The Heckler is our resident trash talker. Fantasy decisions only. Nobody's safe.)<\/em><\/p>\n<ul>\n<li>Jake paid $84 for Jokic, $9 more than anyone has ever paid for anything here, and then filled out the roster with five guys at $1-2. That's the fantasy version of buying a Ferrari and sleeping in it.<\/li>\n<li>The commissioner spent the most money in the league, didn't buy a single superstar, and got projected 3rd by the AI he set up. Nobody's surprised. Everyone's checking the code.<\/li>\n<li>Chase drafted eight centers and left $29 on the table. Either he's a genius or he forgot the auction has guards.<\/li>\n<li>Jordan named his team \"Defending Champion\" and finished third last year. The 2026 Grizzlies fan has rostered zero Grizzlies for two straight seasons. At some point it's just a jersey.<\/li>\n<li>Adam's $48 Jarrett Allen expired, so Alex paid $34 for the same 15.9-point center. The Jarrett Allen economy is the only market in this league with a waiting list.<\/li>\n<li>Kendall spent $121 on two players who combine for 7.4 turnovers a game. He's losing the turnover category before Luka finishes his first pregame shooting routine.<\/li>\n<li>Austin has four players projected for 3.3 or more turnovers a game, and he went out and added Ja Morant anyway. Ja's now on his fifth owner in a year. At this point he's not a player, he's a library book.<\/li>\n<\/ul>\n<hr />\n<h3>Method and sources<\/h3>\n<ul>\n<li><strong>League data:<\/strong> Fantrax rosters, salaries (2026-27 cap hits after the roll-forward), contracts and IR slots from the 10/17 snapshot (<code>2026_opening<\/code>); 2026 auction prices and 2023-25 auction history from the league database.<\/li>\n<li><strong>Projections:<\/strong> Basketball Monster 2026-27 projections (combined), for this league's 9-cat settings, as of 10/17. 9-cat rank is BBM's season-total rank. The 8-cat rank drops turnovers and re-ranks the same projections. All stat lines are per-game.<\/li>\n<li><strong>Team model:<\/strong> each team's top 10 players by 9-cat rank, projected over BBM's games played. Counting categories are summed; FG% and FT% are total makes over total attempts. \"Category win rate\" compares every team with every other team in each category (fewer turnovers wins). It's insensitive to the top-9 vs. top-12 choice at the top and bottom of the rankings, and noisy in the middle.<\/li>\n<li><strong>Injury news:<\/strong> Bam Adebayo (RotoWire, HoopsHype, Heat Nation, 10/14-16); Derrick White (CBS Sports, RotoWire, 10/16).<\/li>\n<li><strong>League rules:<\/strong> IR doesn't count toward roster or cap; a player on IR who plays has to be activated or dropped within 24 hours of tip-off; the default free-agent salary is $10.<\/li>\n<\/ul>"}, {"slug": "2026-10-07_keeper-preview", "title": "The $75 Ceiling", "subtitle": "Ten teams, three days, one contract-year fight, and the number every keeper decision runs through", "date": "2026-10-07", "desk": "The Analyst", "html": "<p>Nobody in this league has ever paid more than $75 for a player at auction.<\/p>\n<p>And only one player a year gets anywhere near it. Across the last three auctions, the most expensive player went for $75, $69 and $71 (Jokic every time). The second-most expensive averaged $63, the fifth $49, the tenth $36, and the twentieth $25. Prices fall off fast after the first few names.<\/p>\n<p>That's why three keeper prices stand out: <strong>Jokic ($95), Shai Gilgeous-Alexander ($85) and Luka Doncic ($77).<\/strong> All three are well above what this room has ever paid for the best player available, and that's by design. The keeper escalator exists to price superstars out of being kept, so they cycle back to the auction and everybody gets a shot at a Jokic. The question for those three owners isn't whether the price is fair. It's whether to break ranks.<\/p>\n<p><strong>How I'm pricing everyone else:<\/strong> I averaged each player's ESPN category-league rank with his current ADP, and figured where he'd fall among the players actually headed to this auction. If he'd be the fifth-best player available, I price him at what the fifth-most-expensive player has cost here on average (about $49). The room's own history, not a formula. The method is at the bottom.<\/p>\n<p>That \"if released\" number is half of the real game everyone plays Saturday. Keep a player at his price, or let him go and bet you can buy him back cheaper at the auction, knowing someone else might pay more. Most owners here end up keeping somewhere between one and five. So the question for each team isn't just which keepers beat their price, it's which ones beat it by enough that you wouldn't risk the bidding.<\/p>\n<hr />\n<h2>The contract-year fight<\/h2>\n<p>Before the money, there's the vote. The rulebook says a contract runs three seasons from an auction buy or waiver pickup and four from a rookie pick, and <strong>keeping, trades and waiver drops don't reset it.<\/strong> Fantrax doesn't know that. On every waiver claim, all 754 of them since 2024, it stamps the player with a fresh contract as if he were a brand-new pickup.<\/p>\n<p>Usually that's harmless. This year it decides keepers. Under the rulebook, these five players are in their final season and <strong>must be dropped,<\/strong> but Fantrax still lets them be kept. Four were reset by a waiver claim. Jalen Williams's contract changed between seasons, and that one is still being traced.<\/p>\n<table>\n<thead>\n<tr>\n<th>Player<\/th>\n<th>Owner<\/th>\n<th>Fantrax<\/th>\n<th>Rulebook<\/th>\n<th>Keep<\/th>\n<th>If cut<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Jalen Johnson<\/strong><\/td>\n<td>Austin<\/td>\n<td>2028<\/td>\n<td>2026<\/td>\n<td>$20<\/td>\n<td>~$52<\/td>\n<\/tr>\n<tr>\n<td><strong>Tyrese Maxey<\/strong><\/td>\n<td>Jordan<\/td>\n<td>2028<\/td>\n<td>2026<\/td>\n<td>$25<\/td>\n<td>~$52<\/td>\n<\/tr>\n<tr>\n<td><strong>Jalen Williams<\/strong><\/td>\n<td>Vaughn<\/td>\n<td>2027<\/td>\n<td>2026<\/td>\n<td>$21<\/td>\n<td>~$28<\/td>\n<\/tr>\n<tr>\n<td><strong>Walker Kessler<\/strong><\/td>\n<td>Jake<\/td>\n<td>2028<\/td>\n<td>2026<\/td>\n<td>$21<\/td>\n<td>~$28<\/td>\n<\/tr>\n<tr>\n<td><strong>P.J. Washington<\/strong><\/td>\n<td>Kendall<\/td>\n<td>2028<\/td>\n<td>2026<\/td>\n<td>$16<\/td>\n<td>~$1<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The two that matter most have a story. <strong>Austin dropped Maxey on March 15. Jordan dropped Jalen Johnson on March 21. On March 22, the last day of the season, each claimed the other's player off waivers,<\/strong> and Fantrax reset both contracts from 2026 to 2028. Two top-10 category players ended up with two extra years each, and nobody traded anybody.<\/p>\n<p>It cuts the other way too. Five players lost a year to the same quirk: Alex Sarr and Kel'el Ware (Chase) and Matas Buzelis (Vaughn) show 2027 when the rulebook says 2028, and Dylan Harper (Austin) and Derik Queen (Jordan) show 2028 instead of 2029. Kon Knueppel (Kendall) was simply entered a year short.<\/p>\n<p>The league is voting on whether to <strong>honor the Fantrax years for this keeper class and fix it going forward,<\/strong> or <strong>correct everything now.<\/strong>\n- <strong>The case for honoring them:<\/strong> Fantrax is the system everyone sees, owners made trades and plans around those numbers, and nobody hid anything.\n- <strong>The case for correcting:<\/strong> the rulebook is clear, and leaving it alone lets a platform quirk hand out extra years on two of the best players in the league.<\/p>\n<p>I'm not taking a side on the vote. I will put a price on it: <strong>about $32 of keeper value for Austin and $27 for Jordan.<\/strong> If the rulebook wins, Jalen Johnson and Maxey both go into the auction pool as top-five players available.<\/p>\n<p>The full history of every disputed contract is on this site's Contract audit tab.<\/p>\n<hr />\n<h2>The auction pool is already loaded<\/h2>\n<p>Even before Saturday's keeper decisions, the pool has:<\/p>\n<ul>\n<li><strong>Anthony Edwards<\/strong> (ESPN cat #5), <strong>Giannis<\/strong> (#20, now in Miami) and <strong>Domantas Sabonis<\/strong> (#32). All three are playoff streaming cuts. Jordan dropped Edwards during 3rd-place week, Yow dropped Giannis off IR on 3/17, and Kendall dropped Sabonis off IR on 3/4. That's how this league plays the playoffs: a roster spot you can stream beats a star who can't play. The bill comes due now, because all three hit the open market.<\/li>\n<li><strong>Jaren Jackson Jr.<\/strong> and <strong>Coby White<\/strong>, both released during last season.<\/li>\n<li><strong>Expiring contracts:<\/strong> Scottie Barnes (#10) and Derrick White (#16) from Brian, Chet Holmgren from Alex, Jarrett Allen from Adam, Paolo Banchero from Yow, and Ja Morant from Jake, ending a career here as the league's most-traded paperweight.<\/li>\n<\/ul>\n<p><strong>The 2026 rookie class<\/strong> goes in Saturday's rookie draft at $1 before the auction ever sees it: Cam Boozer (MEM), AJ Dybantsa (WSH), Caleb Wilson (CHI), Darryn Peterson (UTAH) and Darius Acuff Jr. (SAC).<\/p>\n<hr />\n<h2>The stash market<\/h2>\n<p>The quietest strategy in this league is also one of the best: <strong>buy a good player who's going to miss most of the season, cheap, and stash him.<\/strong> IR has to stay empty from keeper processing through the auction. Right after the draft, the stash goes to IR and the open roster spot goes to a waiver pickup. It costs one of your two IR slots for a season, and it buys a bargain keeper price the next fall.<\/p>\n<p>Last year's stash class is the proof. <strong>Haliburton ($12, Jake), Tatum ($10, Yow) and Kyrie ($5, Alex)<\/strong> combined for 16 games in 2025-26. Jake traded for the other two during the season, and now they keep for $17, $15 and $10 when they'd go for about $49, $52 and $28. Vaughn's Dejounte Murray ($10; Achilles, back for 14 games late last season) and Jake's Lillard ($10) are the same idea paying off.<\/p>\n<p>This year's candidates, from ESPN's injury report:<\/p>\n<table>\n<thead>\n<tr>\n<th>Player<\/th>\n<th>Owner<\/th>\n<th>Keep $<\/th>\n<th>Injury<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Brandon Ingram<\/strong><\/td>\n<td>Adam<\/td>\n<td>$10<\/td>\n<td>Partial Achilles tear; no timetable<\/td>\n<\/tr>\n<tr>\n<td><strong>Shaedon Sharpe<\/strong><\/td>\n<td>Jordan<\/td>\n<td>$6<\/td>\n<td>Torn meniscus; ~6 months<\/td>\n<\/tr>\n<tr>\n<td><strong>Mark Williams<\/strong><\/td>\n<td>Vaughn<\/td>\n<td>$10<\/td>\n<td>Torn labrum; back ~Feb.<\/td>\n<\/tr>\n<tr>\n<td><strong>Donte DiVincenzo<\/strong><\/td>\n<td>Adam<\/td>\n<td>$6<\/td>\n<td>Achilles; back ~April<\/td>\n<\/tr>\n<tr>\n<td><strong>Jimmy Butler<\/strong><\/td>\n<td>Chase<\/td>\n<td>$24<\/td>\n<td>Knee; back early 2027<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The one to watch is <strong>Ingram,<\/strong> whose partial Achilles tear was found during heel surgery. He was a top-80 category player before the injury, and healthy he'd go for about $17 in this room. Adam can keep him at $10 and stash him (next year's keeper price would be $15), or let him go and find out what the room thinks a 29-year-old with a partially torn Achilles is worth. Injured players always produce the auction's strangest prices, and Ingram might set the high mark this year. Sharpe at $6 is the cleanest stash on the board: 20.8 points a game last season, 23 years old, and an $11 keeper price next fall. Butler at $24 is too expensive to stash.<\/p>\n<hr />\n<h2>Team by team<\/h2>\n<p><em>Keeper price, then about what he'd cost if released into this year's auction. Money left = confirmed 2026-27 budget minus keepers minus the $1 rookie pick.<\/em><\/p>\n<h3>Austin, Crossover Cringle ($186)<\/h3>\n<p><strong>Jalen Johnson at $20<\/strong> is the best non-rookie keeper price in the league. He'd be one of the first five players off the board, which runs about $52 here. ESPN ranks him 9th in category leagues and Karabell has him on his \"do draft\" list. He's also the face of the contract-year fight, so Austin's keeper plan depends on the vote.<\/p>\n<p>Cade Cunningham at $47 is fair, not a steal (about $52). Brunson at $32 is a solid value (about $43).<\/p>\n<p>Then there's <strong>Jokic at $95<\/strong>, $20 more than this room has ever paid for anyone. Keeping Jokic, Johnson and Cade costs $162 and leaves <strong>$23 for 10 roster spots.<\/strong> Swapping Jokic for Brunson leaves $86. My lean: let Jokic cycle and be in the bidding at $70-plus. Kendall will be too.<\/p>\n<p>Curry ($48, about $43) is close to fair, and Giddey ($44, about $36) is a little over. Zion at $32 isn't close: he'd go for about $14, and he's on both ESPN's bust list and Karabell's do-not-draft list.<\/p>\n<h3>Brian, To the Victor Belong the Spoils ($195)<\/h3>\n<p>Last year's runner-up has <strong>the best contract in the league: Wembanyama at $16,<\/strong> for a player who'd be the second-most-expensive player in the auction (about $63). He was Brian's rookie pick, and his contract year is 2027, so this is the last season Brian can keep him. Next fall he hits the open auction. That makes him the trade chip to watch all season. After the roll-forward his cap hit is $21, so if Brian falls out of the race, any contender can fit a top-2 player under the cap.<\/p>\n<p>The bad news: Barnes and Derrick White both expire, two top-16 category players lost for nothing. The tough calls are the two big salaries. <strong>Towns at $65 and Booker at $55<\/strong> would go for about $46 and $31 if released, so together they're about $40 over market. Letting both go and keeping the cheap guys (Herro $7, Mikal Bridges $11, Okongwu $15, Jaylen Brown $23) leaves Brian about <strong>$122 for 8 spots.<\/strong> That's enough to buy back a star.<\/p>\n<h3>Jake, Trash Pandas ($220)<\/h3>\n<p>The most dangerous team in the room, and it's the stash strategy paying off. <strong>Tatum at $15 and Haliburton at $17<\/strong> are last year's stashes, Kyrie at $10 (about $28) is the third, and <strong>Cooper Flagg at $6<\/strong> is the rookie on top. That's $38 for Flagg, Tatum and Haliburton, three players who'd each go for about $46-52.<\/p>\n<p>Yes, both stars are coming off Achilles injuries. Tatum played 16 games and Haliburton played zero, and FantraxHQ's Ray Kuhn expects rust before Haliburton gets back to double-digit assists. That was the point: Jake paid for last season's absence so he wouldn't have to pay for this season's production.<\/p>\n<p>Add Siakam ($18) and Kessler ($21, an ESPN breakout pick as the Lakers' starting big, though his contract year is in dispute). That's about $87 kept, <strong>$132 for 7 spots,<\/strong> and the league's maximum budget. Lillard at $10 is a closer call than it looks. The boards put him around $18, but he's 36, about 20 months removed from his Achilles tear, and on Karabell's do-not-draft list.<\/p>\n<h3>Jordan, Defending Champion ($184)<\/h3>\n<p>The trade machine (9 of last season's 18 trades) has two no-brainers: <strong>Jamal Murray at $17<\/strong> (about $43) and <strong>Austin Reaves at $17<\/strong> (about $29, and on Karabell's do-draft list). Then there's <strong>Maxey at $25<\/strong> (about $52), a no-brainer only if the vote goes his way. That's $59 for the three, leaving $124 for 10 spots.<\/p>\n<p>Mobley ($45, about $42) and Harden ($39, about $35) are both priced close to where they'd go, and both are on Karabell's do-draft list, so keeping either is defensible. My model likes LeBron at $19, but two ESPN analysts have him on bust lists now that he's in Philadelphia. Shaedon Sharpe at $6 is a stash candidate (see above). And Jordan, you know where Edwards is.<\/p>\n<h3>Yow, El Niño Maravilla ($190)<\/h3>\n<p>The champ's core is strong: <strong>Amen Thompson at $16<\/strong> (about $43), <strong>Donovan Mitchell at $39<\/strong> (about $52), Durant at $35 (about $43; 38 years old, now in Houston) and Trey Murphy at $11 (about $28).<\/p>\n<p><strong>Luka at $77<\/strong> is the escalator doing its job: he'd likely go for about $56 as the third-best player in the pool. Keep all five and it's $178 kept with <strong>$11 for 8 spots.<\/strong> Let Luka go and it's $88 for 9. The commissioner also holds pick #4.<\/p>\n<h3>Vaughn, Markkanen My Words ($205)<\/h3>\n<p><strong>SGA at $85<\/strong> would go for about $63. Around him is the league's deepest group of cheap mid-tier keepers:\n- Bane ($10) and Michael Porter Jr. ($9, now in Brooklyn): about $27-28 each.\n- Brandon Miller ($16): Rob McCormick picks him as a breakout, with usage set to spike in Charlotte.\n- Buzelis, Edgecombe and Keyonte George, plus Dejounte Murray ($10, about $21), back from his Achilles.\n- Mark Williams ($10): out until about February, so a stash decision.\n- Jalen Williams ($21): one of the five contract-year must-drops under the rulebook.<\/p>\n<p>Keep SGA plus the seven core mid-tier guys (Bane, Porter, Williams, Miller, Buzelis, Edgecombe, George) and it's about $166 kept with <strong>$38 for 5 spots.<\/strong> Without SGA, Vaughn has about $123 and pick #3. Either works, but eight keepers would be more than almost anyone here carries. The likelier play is to keep the three or four best values (Bane, Porter, Miller, Dejounte Murray) and take his chances at the auction on the rest.<\/p>\n<h3>Adam, Ball Is Life ($200)<\/h3>\n<p>Quietly efficient:\n- <strong>Sengun at $19:<\/strong> would go for about $43, and he's on Karabell's do-draft list.\n- <strong>Bam at $39:<\/strong> about $43, ESPN #15.\n- <strong>Markkanen at $16:<\/strong> about $29.\n- <strong>Nickeil Alexander-Walker at $10:<\/strong> about $28.\n- <strong>Naz Reid at $17:<\/strong> about $28, and the preseason's consensus sleeper now that he's starting in Charlotte.<\/p>\n<p>That's $101 kept and $98 for 8 spots. The one flag is that Markkanen is on Karabell's do-not-draft list over his declining games played. Adam also has two of the five stash candidates, Ingram and DiVincenzo, and only two IR slots. Jarrett Allen's $48 contract expires, and that's no loss.<\/p>\n<h3>Alex, 10th in power rankings ($210)<\/h3>\n<p>Holds <strong>the #1 rookie pick<\/strong>, and that's the decision of the weekend. The boards disagree: ADP likes Boozer, ESPN likes Caleb Wilson, and the Old Man Squad buckets have Peterson as a top-tier upside flier.<\/p>\n<p>The keeper side is solid: Clingan ($11, about $28), Duren ($32, about $36; FantraxHQ expects 20-and-10 after his extension), Garland ($7, about $26) and LaMelo ($41, about $43). That's $91 kept and $118 to spend. LaMelo is on Karabell's do-not-draft list over his scoring and efficiency. Anthony Davis at $43 is priced about right on paper, but he's on nearly every bust list, so I'd let him go. Holmgren expires.<\/p>\n<h3>Chase, Go Basketball ($197)<\/h3>\n<p>The weekend's biggest cleanup: <strong>Trae Young ($59; about $29 if released, after 15 games last year; now in Washington), Deandre Ayton ($37) and Jimmy Butler ($24, out until early 2027). That's $120 of keeper prices to release.<\/strong><\/p>\n<p>The keepers are good. Kawhi at $20 would go for about $43, even with Karabell's do-not-draft tag and an ADP that's slid from 21 to 32. Add Dyson Daniels ($11, about $27), Alex Sarr and <strong>Kel'el Ware ($11)<\/strong>. Ware was traded four times last season and ended up back where he started, and he's now a consensus breakout (ESPN, FantraxHQ, Karabell) after the Giannis trade gave him Milwaukee's starting center job. Chase should have about $143 to spend.<\/p>\n<h3>Kendall, Kenda-lllllllll ($213)<\/h3>\n<p><strong>The bank.<\/strong> Kon Knueppel at $6 (about $28) is the only big value, and his contract is one the vote touches (Fantrax shows him a year short). Randle ($9) and Castle ($11) are both on Karabell's do-draft list and worth about $15 each. Fox at $18 is about even. Keep Knueppel, Randle and Castle and Kendall walks into the auction with <strong>about $186, the most in the room by more than $40,<\/strong> plus pick #2. If anyone pays $70-plus for Jokic, Edwards or Giannis, it's Kendall.<\/p>\n<hr />\n<h2>Three things to watch Saturday<\/h2>\n<ol>\n<li><strong>The contract vote.<\/strong> Jalen Johnson and Maxey are either two of the best keeper values in the league or two of the best players in the auction.<\/li>\n<li><strong>Jokic, SGA, Luka.<\/strong> That's $257 of keeper prices for players who'd go for about $72, $63 and $56. Every one released makes the top of the pool deeper.<\/li>\n<li><strong>IR has to be empty when keepers are processed.<\/strong> Cade, Curry, Haliburton, Trae, Markkanen and others are sitting in IR slots in Fantrax right now. Every keeper counts toward 14 until the auction is over, and that includes a stash you plan to IR later.<\/li>\n<\/ol>\n<hr />\n<h3>Method and sources<\/h3>\n<ul>\n<li><strong>League data:<\/strong> Fantrax rosters, salaries and contract years as of 10/6, auction results 2023-25, 2025-26 trades, and daily roster history since 2022 (the source of the contract audit).<\/li>\n<li><strong>Consensus rank:<\/strong> average of ESPN H2H category rank (Andre Snellings, preseason 2026-27) and 10/4 ADP from the @DanBesbris / Old Man Squad Super G-Sheet.<\/li>\n<li><strong>Prices:<\/strong> this room's average auction price by slot over 2023-25 (most expensive $72, 2nd $63, 3rd $56, 5th $49, 10th $36, 20th $25, 30th $15). A player's estimate is the price of the slot he'd fill among this year's likely auction pool, with keepers as described above and the 2026 rookies excluded. Estimates are rounded, and real auctions swing a few dollars either way.<\/li>\n<li><strong>Injuries:<\/strong> ESPN NBA injury report, 10/7.<\/li>\n<li><strong>Commentary cited:<\/strong> ESPN (Karabell's Do Draft and Do Not Draft lists; the staff sleepers, breakouts and busts piece), FantraxHQ (Ray Kuhn's PG and C rankings; the Giannis and Kawhi trade breakdowns), Old Man Squad draft buckets.<\/li>\n<li><strong>Cross-checks:<\/strong> Hashtag Basketball's 2026-27 projections (public top 30) and Basketball Monster's 2025-26 rankings. BBM's 2026-27 projections and Hashtag's full list are members-only; Yahoo had no 2026-27 analysis posted.<\/li>\n<\/ul>\n<hr />\n<h2>From the Heckler's desk<\/h2>\n<p><em>(The Heckler is our resident trash talker. Fantasy decisions only. Nobody's safe.)<\/em><\/p>\n<ul>\n<li>Austin and Jordan swapped Maxey and Jalen Johnson through the waiver wire on the last day of the season, and Fantrax handed both of them two free contract years. Best trade of the season, and technically neither of them made it.<\/li>\n<li>The commissioner traded Tatum for Holmgren, Banchero and Amen, flipped Holmgren and LaMelo for Giannis, cut Giannis in the playoffs, and won the title anyway. Jake now has Tatum for $15. Everybody won, which is the most suspicious outcome possible in a league run by the guy who won.<\/li>\n<li>Kel'el Ware was traded four times and came home. Chase got a breakout candidate, Jake, Jordan and Kendall got the frequent-flyer miles, and Fantrax took a year off his contract for the trouble.<\/li>\n<li>Ja Morant: four owners, five stops, 20 games, a contract that expires Saturday. No one in the league kept him longer than a carton of milk.<\/li>\n<li>Kendall has $186 and is about to be the most popular person in the group chat for exactly one evening.<\/li>\n<\/ul>"}]};
const R = DATA.rules;
const fmt = n => (n < 0 ? "-$" + Math.abs(n) : "$" + n);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tip = text => `<span class="tip" tabindex="0" data-tip="${esc(text)}">?</span>`;
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const dt = s => new Date(s);
const day = s => dt(s + "T12:00").toLocaleDateString([], {month:"short", day:"numeric", year:"numeric"});

// ---------- tooltips (hover on desktop, tap on phones) ----------
const tipEl = document.getElementById("tooltip");
let tipFor = null;
function showTip(el){
  tipFor = el; tipEl.textContent = el.dataset.tip; tipEl.classList.add("show");
  const r = el.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let x = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8);
  let y = r.bottom + 8; if (y + h > innerHeight - 8) y = r.top - h - 8;
  tipEl.style.left = x + "px"; tipEl.style.top = y + "px";
}
function hideTip(){ tipFor = null; tipEl.classList.remove("show"); }
document.addEventListener("mouseover", e => { const t = e.target.closest("[data-tip]"); if (t) showTip(t); });
document.addEventListener("mouseout", e => { if (e.target.closest("[data-tip]")) hideTip(); });
document.addEventListener("focusin", e => { const t = e.target.closest("[data-tip]"); if (t) showTip(t); });
document.addEventListener("focusout", hideTip);
document.addEventListener("click", e => { const t = e.target.closest("[data-tip]"); if (t) { tipFor === t ? hideTip() : showTip(t); } else hideTip(); });
addEventListener("scroll", hideTip, {passive:true});

// ---------- navigation ----------
const DRAFT = DATA.phase === "draft";
const SECTIONS = [["overview","Overview"],["news","Newsroom"],["rosters", DRAFT ? "Draft board" : "Rosters & keepers"],["rookies","Rookie draft order"],["budgets","Auction budgets"],["trades","Money trades"],["audit","Contract audit"]]
  .concat(DATA.archive && DATA.archive.length ? [["archive","Archive"]] : []);
document.getElementById("sideNav").innerHTML = SECTIONS.map(([id,t]) => `<li><a href="#${id}" data-s="${id}">${t}</a></li>`).join("");
document.getElementById("mobileNav").innerHTML = SECTIONS.map(([id,t]) => `<a href="#${id}" data-s="${id}" role="tab">${t.replace(" & keepers","")}</a>`).join("");
document.getElementById("seasonSmall").textContent = DATA.season + (DRAFT ? " league guide" : " keeper guide");
document.getElementById("foot").textContent = "Rosters as of " + dt(DATA.snapshot.taken).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
const setNav = c => { document.body.classList.toggle("nav-collapsed", c); store.set("navCollapsed", c); };
document.getElementById("closeNav").onclick = () => setNav(true);
document.getElementById("openNav").onclick = () => setNav(false);
setNav(store.get("navCollapsed", false));

function route(){
  const [sec, arg] = (location.hash.slice(1) || "overview").split("/");
  const id = SECTIONS.some(s => s[0] === sec) ? sec : "overview";
  document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id === id));
  document.querySelectorAll("[data-s]").forEach(a => a.classList.toggle("on", a.dataset.s === id));
  if (id === "news") renderNews(arg);
  if (id === "rosters") selectTeam(decodeURIComponent(arg || store.get("team", DATA.teams[0].owner_name)));
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

document.getElementById("dates").innerHTML = (DRAFT ? [
  ["Auction draft", dt(DATA.dates.auction), true],
] : [
  ["Keepers due", dt(DATA.dates.keeperDeadline), true],
  ["Rookie draft", dt(DATA.dates.keeperDeadline), false],
  ["Auction draft", dt(DATA.dates.auction), true],
]).map(([k, d, t]) => `<div class="date">${k}<b>${d.toLocaleDateString([], {weekday:"short",month:"short",day:"numeric"})}${t ? ", " + d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}) + " ET" : " (by text)"}</b></div>`).join("");

// ---------- newsroom ----------
const longDate = s => new Date(s + "T12:00:00").toLocaleDateString([], {weekday:"long",month:"long",day:"numeric",year:"numeric"});
function renderNews(slug){
  const v = document.getElementById("newsView"), a = DATA.news.find(n => n.slug === slug);
  if (!a) {
    v.innerHTML = `<h1>Newsroom</h1><p class="muted">League coverage, written by Claude from the Fantrax data and the major fantasy sites. Takes are opinions; numbers are sourced.</p>
      <div class="newslist">${DATA.news.map(n => `<a class="panel" href="#news/${n.slug}"><div class="kicker">${esc(n.desk)} · ${longDate(n.date)}</div><b>${esc(n.title)}</b><span>${esc(n.subtitle)}</span></a>`).join("") || '<p class="muted">Nothing yet.</p>'}</div>`;
    return;
  }
  v.innerHTML = `<a class="back" href="#news">‹ All stories</a><article class="panel article">
    <div class="kicker">${esc(a.desk)}</div><h1>${esc(a.title)}</h1>${a.subtitle ? `<p class="dek">${esc(a.subtitle)}</p>` : ""}
    <div class="byline">By ${esc(a.desk)} · ${longDate(a.date)}</div><div class="body">${a.html}</div></article>`;
}

document.getElementById("ovCards").innerHTML = (DATA.news.length ? `<a class="panel lead" href="#news/${DATA.news[0].slug}"><b>Newsroom: ${esc(DATA.news[0].title)}</b><span>${esc(DATA.news[0].subtitle)}</span></a>` : "") + [
  DRAFT ? ["rosters", "Draft board", "Every team's keepers and rookie, money left, open spots and max bid for the auction."]
        : ["rosters", "Rosters & keepers", "Every roster with keeper costs. Check players to plan your keepers."],
  ["rookies", "Rookie draft order", "Picks 1-10 and any traded picks."],
  ["budgets", "Auction budgets", "Each team's 2026-27 auction money."],
  ["trades", "Money trades", "The trades behind those budgets."],
  ["audit", "Contract audit", "Players whose Fantrax contract differs from the rulebook, with each one's history."],
].concat(DATA.archive && DATA.archive.length ? [["archive", "Archive", "Earlier pages, like the pre-keeper planner."]] : []).map(([id, t, d]) => `<a class="panel" href="#${id}"><b>${t}</b><span>${d}</span></a>`).join("");

// ---------- keeper planner ----------
const chips = document.getElementById("teamChips");
chips.innerHTML = DATA.teams.map(t => `<button class="chip" role="tab" data-owner="${esc(t.owner_name)}">${esc(t.owner_name)}</button>`).join("");
chips.addEventListener("click", e => { const b = e.target.closest(".chip"); if (b) location.hash = "rosters/" + encodeURIComponent(b.dataset.owner); });

let current = null;
function selectTeam(owner){
  current = DATA.teams.find(t => t.owner_name === owner) || DATA.teams[0];
  store.set("team", current.owner_name);
  chips.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.owner === current.owner_name));
  DRAFT ? renderDraftTeam() : renderTeam();
  resortAll();
}
const planKey = t => `plan:${DATA.season}:${t.owner_name}`;
const getPlan = t => store.get(planKey(t), null) || { keep: [], rookie: true };
const showStats = () => store.get("showStats", true);
document.body.classList.toggle("hide-stats", !showStats());

// stats = [gp,fgm,fga,tpm,ftm,fta,pts,reb,ast,stl,blk,tov]
const CATS = [["PTS",6],["REB",7],["AST",8],["STL",9],["BLK",10],["3PM",3],["FG%","fg"],["FT%","ft"],["TO",11]];
const val = (s, k) => k === "fg" ? (s[2] ? s[1] / s[2] : 0) : k === "ft" ? (s[5] ? s[4] / s[5] : 0) : s[k] / s[0];
const show = (s, k) => (k === "fg" || k === "ft") ? val(s, k).toFixed(3).replace(/^0/, "") : val(s, k).toFixed(1);
// Rank each category against every rostered player with 10+ games. TO is reversed (fewer is better).
// Baseline: every player rostered before keepers (10+ games), so the colors mean the same all season.
const POOL = DATA.statPool && DATA.statPool.length ? DATA.statPool
  : DATA.teams.flatMap(t => t.players).filter(p => p.stats && p.stats[0] >= 10).map(p => p.stats);
const SORTED = Object.fromEntries(CATS.map(([, k]) => [k, POOL.map(s => val(s, k)).sort((a, b) => a - b)]));
function pctile(s, k){
  const arr = SORTED[k], v = val(s, k);
  let lo = 0; while (lo < arr.length && arr[lo] < v) lo++;
  const q = lo / arr.length;
  return k === 11 ? 1 - q : q;
}
const heat = (s, k) => {
  const q = pctile(s, k);
  return q >= .5 ? `background:rgba(var(--heat),${((q - .5) * 2 * .45).toFixed(2)})`
                 : `background:rgba(var(--cold),${((.5 - q) * 2 * .3).toFixed(2)})`;
};
function statCells(p){
  const s = p.stats;
  if (!s) return `<td class="statcol grp dnp" colspan="${CATS.length + 1}">Did not play in ${DATA.statsSeason}</td>`;
  return `<td class="num statcol grp">${s[0]}</td>` + CATS.map(([, k]) => `<td class="num statcol h" style="${heat(s, k)}">${show(s, k)}</td>`).join("");
}
function mobileStats(p){
  const s = p.stats;
  if (!s) return `<div class="mstat dnp">Did not play in ${DATA.statsSeason}</div>`;
  return `<div class="mstat"><div class="pills"><span class="pill">GP<b>${s[0]}</b></span>`
    + CATS.map(([c, k]) => `<span class="pill" style="${heat(s, k)}">${c}<b>${show(s, k)}</b></span>`).join("") + `</div></div>`;
}

function renderTeam(){
  const t = current, plan = getPlan(t);
  const keepSet = new Set(plan.keep.filter(id => t.players.some(p => p.id === id && !p.mustDrop)));
  const kept = t.players.filter(p => keepSet.has(p.id));
  const keeperCost = kept.reduce((s, p) => s + (p.cost || 0), 0);
  const rookie = plan.rookie ? 1 : 0;
  const left = t.budget - keeperCost - rookie * R.rookieCost;
  const spots = R.rosterSpots - kept.length - rookie;
  const maxBid = spots > 0 ? left - (spots - 1) : 0;
  const mustDrop = t.players.filter(p => p.mustDrop);

  const issues = [];
  if (left < 0) issues.push(["bad", `Keepers cost ${fmt(-left)} more than the auction budget.`]);
  if (spots < 0) issues.push(["bad", `${-spots} over the ${R.rosterSpots}-man roster.`]);
  if (left >= 0 && spots > 0 && left < spots) issues.push(["bad", `Not enough money to fill ${spots} spots at $1 each.`]);
  const irKept = kept.filter(p => p.ir);
  if (irKept.length) issues.push(["warn", `IR must be empty at keeper processing: ${irKept.map(p => p.name).join(", ")}.`]);
  let status;
  if (issues.length) status = issues[0].concat(issues.length > 1 ? [issues.slice(1).map(i => i[1]).join(" ")] : []);
  else if (kept.length) status = ["ok", `Valid plan: ${kept.length} keeper${kept.length > 1 ? "s" : ""}, ${fmt(left)} for ${spots} spot${spots === 1 ? "" : "s"}.`];
  else status = ["idle", "Check the players you'd keep."];

  const rows = t.players.map(p => {
    const on = keepSet.has(p.id);
    const fixNote = p.fantraxContract ? ` Corrected from ${p.fantraxContract} by league vote on 10/10/26 (see Contract audit).` : "";
    const badges = (p.mustDrop ? `<span class="badge drop" data-tip="Contract is up. He can't be kept and goes back into the auction pool.${fixNote}">MUST DROP${p.fantraxContract ? " *" : ""}</span>` : "")
      + (p.ir ? `<span class="badge ir" data-tip="On IR now. IR must be emptied when keepers are processed and stay empty through the auction.">IR</span>` : "")
      + (!p.mustDrop && p.contract ? `<span class="badge cy${p.fantraxContract ? " fixed" : ""}" data-tip="Contract year ${p.contract}: he must be dropped before the ${p.contract}-${String(p.contract + 1).slice(2)} season, so he can be kept through ${p.keepThrough}.${fixNote}">${p.contract}${p.fantraxContract ? " *" : ""}</span>` : "");
    return `<tr class="${p.mustDrop ? "drop" : on ? "kept" : ""}">
      <td><input type="checkbox" class="keep" data-id="${p.id}" ${on ? "checked" : ""} ${p.mustDrop ? "disabled" : ""} aria-label="Keep ${esc(p.name)}"></td>
      <td class="player"><span class="pname">${esc(p.name)}</span>${badges}<div class="pmeta">${[(p.pos || "").split(",").join("/"), p.nba, p.age ? "age " + p.age : ""].filter(Boolean).map(x => `<span class="nw">${esc(x)}</span>`).join(" · ")}</div>${mobileStats(p)}</td>
      <td class="num"><b>${p.mustDrop ? "-" : fmt(p.cost)}</b></td>
      ${statCells(p)}
    </tr>`;
  }).join("");

  document.getElementById("teamView").innerHTML = `
    <div class="teamhead"><h2>${esc(t.owner_name)} <span class="tn">· ${esc(t.team_name)}</span></h2>
      <span class="pmeta">${t.players.length} rostered · ${mustDrop.length} must drop</span></div>
    <div class="calc">
      <div class="stats">
        <div class="stat"><div class="k">Budget${tip("2026-27 auction budget: $200 plus or minus last season's money trades.")}</div><div class="v">${fmt(t.budget)}</div></div>
        <div class="stat"><div class="k">Keepers (${kept.length})</div><div class="v">${fmt(keeperCost)}</div></div>
        <div class="stat"><div class="k">Rookie pick${tip("Every rookie pick costs $1 and takes a roster spot. Turn off with the toggle below.")}</div><div class="v">${fmt(rookie * R.rookieCost)}</div></div>
        <div class="stat ${left < 0 ? "neg" : "hi"}"><div class="k">Left</div><div class="v">${fmt(left)}</div></div>
        <div class="stat ${spots < 0 ? "neg" : ""}"><div class="k">Open spots${tip("14 roster spots minus keepers minus the rookie pick.")}</div><div class="v">${spots}</div></div>
        <div class="stat"><div class="k">Max bid${tip("Most you can bid on one player while still leaving $1 for every other open spot.")}</div><div class="v">${spots > 0 && left > 0 ? fmt(maxBid) : "-"}</div></div>
      </div>
      <div class="status ${status[0]}">${esc(status[1])}${status[2] ? tip(status[2]) : ""}</div>
    </div>
    <div class="toolbar">
      <button class="btn" id="keepAll">Check all keepable</button>
      <button class="btn" id="clearAll">Clear</button>
      <button class="btn primary" id="copyPlan">Copy my plan</button>${tip("Copies a one-line summary of your keepers and money left, ready to paste in the group text.")}
      <span class="toggles">
        <label class="tog"><input type="checkbox" id="rookieTog" ${plan.rookie ? "checked" : ""}> Rookie pick</label>
        <label class="tog"><input type="checkbox" id="statsTog" ${showStats() ? "checked" : ""}> ${DATA.statsSeason} stats</label>
      </span>
    </div>
    <div class="panel scroll"><table>
      <thead><tr><th style="width:40px">Keep</th><th>Player</th>
        <th class="num">Cost${tip("Keeper price for 2026-27, as Fantrax shows it today.")}</th>
        <th class="num statcol grp">GP${tip(`${DATA.statsSeason} regular season. Per-game averages; FG% and FT% are season totals. Green/red shading ranks each stat against every rostered player (10+ games). TO is reversed: fewer is greener.`)}</th>
        ${CATS.map(([c]) => `<th class="num statcol">${c}</th>`).join("")}
      </tr></thead>
      <tbody>${rows}</tbody></table>
      <div class="legend statlegend">Weak <i style="background:rgba(var(--cold),.3)"></i><i style="background:var(--chip)"></i><i style="background:rgba(var(--heat),.45)"></i> Strong</div></div>`;

  const save = upd => { store.set(planKey(t), Object.assign(getPlan(t), upd)); renderTeam(); };
  document.querySelectorAll("#teamView .keep").forEach(cb => cb.addEventListener("change", () => {
    const s = new Set(getPlan(t).keep); cb.checked ? s.add(cb.dataset.id) : s.delete(cb.dataset.id); save({ keep: [...s] });
  }));
  document.getElementById("keepAll").onclick = () => save({ keep: t.players.filter(p => !p.mustDrop).map(p => p.id) });
  document.getElementById("clearAll").onclick = () => save({ keep: [] });
  document.getElementById("rookieTog").onchange = e => save({ rookie: e.target.checked });
  document.getElementById("statsTog").onchange = e => { store.set("showStats", e.target.checked); document.body.classList.toggle("hide-stats", !e.target.checked); };
  document.getElementById("copyPlan").onclick = async e => {
    const txt = `${t.owner_name} keepers (${kept.length}): ` + (kept.map(p => `${p.name} ${fmt(p.cost)}`).join(", ") || "none")
      + `\nKeepers ${fmt(keeperCost)} · Left for auction ${fmt(left)} · Open spots ${spots}`;
    try { await navigator.clipboard.writeText(txt); e.target.textContent = "Copied"; }
    catch(err){ prompt("Copy this:", txt); }
    setTimeout(() => { e.target.textContent = "Copy my plan"; }, 1500);
  };
}

// ---------- trades as "who gets what" tables ----------
function tradeCard({ title, date, money, sides, note }){
  const [a, b] = Object.keys(sides);
  const list = items => `<ul>${items.map(([cls, txt]) => `<li class="${cls}">${esc(txt)}</li>`).join("") || "<li class='muted'>-</li>"}</ul>`;
  return `<div class="panel trade">
    <div class="head"><span class="title">${esc(title)}${money ? `<span class="money">${esc(money)}</span>` : ""}${note ? tip(note) : ""}</span><span class="d">${day(date)}</span></div>
    <table class="swap"><thead><tr><th>${esc(a)} gets</th><th>${esc(b)} gets</th></tr></thead>
      <tbody><tr><td>${list(sides[a])}</td><td>${list(sides[b])}</td></tr></tbody></table></div>`;
}
function sidesFor(a, b, players){
  const sides = { [a]: [], [b]: [] };
  players.forEach(m => (sides[m.to] = sides[m.to] || []).push(["", m.player]));
  return sides;
}

// ---------- sortable tables ----------
// Click a header: numbers sort high → low first, text A → Z; click again to reverse.
// Blanks, "-" and "Did not play" always go last. Sort choice survives re-renders (e.g. switching teams).
const sortState = {};
const sortKeyOf = table => table.id || (table.closest("#teamView") ? "teamView" : null);
function cellAt(row, col){              // logical column index, accounting for colspan
  let i = 0;
  for (const c of row.cells){ if (col < i + c.colSpan) return c.colSpan > 1 && col !== i ? null : c; i += c.colSpan; }
  return null;
}
function sortValue(cell){
  if (!cell) return null;
  const el = cell.querySelector(".pname") || cell;
  const t = el.textContent.trim();
  if (!t || t === "-" || /^did not play/i.test(t)) return null;
  if (t === "Now") return Number.MAX_SAFE_INTEGER;                                  // timeline "today" row
  if (/^[A-Z][a-z]{2} \d{1,2}, \d{4}$/.test(t)) return Date.parse(t);            // "Oct 27, 2023"
  const m = t.replace(/,/g, "").match(/^([+-]?)\$?(-?)\$?(\d*\.?\d+)/);           // $114, -$48, +$27, .476, 3 · $28
  if (m) return parseFloat(m[3]) * (m[1] === "-" || m[2] === "-" ? -1 : 1);
  return t.toLowerCase();
}
function applySort(table, col, dir){
  const body = table.tBodies[0]; if (!body) return;
  const rows = [...body.rows].map(r => ({ r, v: sortValue(cellAt(r, col)) }));
  rows.sort((a, b) => {
    if (a.v === null) return b.v === null ? 0 : 1;
    if (b.v === null) return -1;
    const c = typeof a.v === "number" && typeof b.v === "number" ? a.v - b.v : String(a.v).localeCompare(String(b.v));
    return dir === "asc" ? c : -c;
  });
  rows.forEach(x => body.appendChild(x.r));
  table.querySelectorAll("thead th").forEach((th, i) => { th.classList.toggle("asc", i === col && dir === "asc"); th.classList.toggle("desc", i === col && dir === "desc"); });
}
function resortAll(){
  document.querySelectorAll("main table:not(.swap)").forEach(table => {
    const k = sortKeyOf(table), st = k && sortState[k];
    if (st) applySort(table, st.col, st.dir);
  });
}
document.addEventListener("click", e => {
  if (e.target.closest("[data-tip]")) return;                 // "?" opens its tooltip, doesn't sort
  const th = e.target.closest("main table:not(.swap) thead th"); if (!th) return;
  const table = th.closest("table"), col = [...th.parentElement.children].indexOf(th);
  const first = [...table.tBodies[0].rows].map(r => sortValue(cellAt(r, col))).find(v => v !== null);
  const cur = th.classList.contains("desc") ? "desc" : th.classList.contains("asc") ? "asc" : null;
  const dir = cur ? (cur === "asc" ? "desc" : "asc") : (typeof first === "number" ? "desc" : "asc");
  applySort(table, col, dir);
  const k = sortKeyOf(table); if (k) sortState[k] = { col, dir };
});

route();
