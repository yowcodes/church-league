<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Church League Keepers</title>
<meta name="description" content="Church League 2026-27 keeper planner: rosters, keeper costs, rookie draft order, auction budgets.">
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#15191e; --muted:#5f6b7a; --line:#e3e7ec;
  --accent:#1f5fbf; --accent-soft:#e8f0fc; --good:#1a7f4b; --good-soft:#e6f4ec;
  --bad:#b42318; --bad-soft:#fdecea; --warn:#9a5b00; --warn-soft:#fff4e0; --chip:#eef1f5;
  --tip-bg:#1f2630; --tip-ink:#f3f5f8; --shadow:0 1px 2px rgba(16,24,40,.06);
  --heat:26,127,75; --cold:180,35,24;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1318; --panel:#171c23; --ink:#e8ecf1; --muted:#9aa6b4; --line:#2a313b;
    --accent:#6ea1ff; --accent-soft:#1c2a42; --good:#4cc38a; --good-soft:#15291f;
    --bad:#ff7b72; --bad-soft:#3a1d1b; --warn:#f0b35a; --warn-soft:#33270f; --chip:#222933;
    --tip-bg:#e8ecf1; --tip-ink:#11161c; --shadow:none; --heat:76,195,138; --cold:255,123,114;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1318; --panel:#171c23; --ink:#e8ecf1; --muted:#9aa6b4; --line:#2a313b;
  --accent:#6ea1ff; --accent-soft:#1c2a42; --good:#4cc38a; --good-soft:#15291f;
  --bad:#ff7b72; --bad-soft:#3a1d1b; --warn:#f0b35a; --warn-soft:#33270f; --chip:#222933;
  --tip-bg:#e8ecf1; --tip-ink:#11161c; --shadow:none; --heat:76,195,138; --cold:255,123,114;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
button{font:inherit}

/* ---- layout + collapsible sidebar ---- */
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh;transition:grid-template-columns .15s}
body.nav-collapsed .app{grid-template-columns:0 minmax(0,1fr)}
nav.side{background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow:hidden;white-space:nowrap}
body.nav-collapsed nav.side{padding:0;border:0}
.brand{display:flex;justify-content:space-between;align-items:flex-start;padding:0 4px 0 8px}
.brand b{font-size:15px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;margin-top:2px}
.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;width:30px;height:30px;cursor:pointer;display:grid;place-items:center;font-size:14px;line-height:1}
.iconbtn:hover{color:var(--accent);border-color:var(--accent)}
nav.side ul{list-style:none;margin:22px 0 0;padding:0}
nav.side a{display:block;padding:9px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
nav.side a:hover{background:var(--chip)}
nav.side a.on{background:var(--accent-soft);color:var(--accent)}
.side-foot{position:absolute;bottom:18px;left:22px;color:var(--muted);font-size:10.5px}
#openNav{position:fixed;top:14px;left:14px;z-index:20;display:none;box-shadow:var(--shadow)}
body.nav-collapsed #openNav{display:grid}
body.nav-collapsed main{padding-left:64px}
main{padding:24px 32px 60px;max-width:1180px;width:100%}
h1{font-size:21px;margin:0 0 16px;display:flex;align-items:center;gap:8px}
h2.sec{font-size:15px;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
section{display:none}
section.on{display:block}

/* ---- tooltips ---- */
.tip{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;border:1.5px solid currentColor;color:var(--muted);font-size:9.5px;font-weight:700;cursor:help;vertical-align:1px;margin-left:4px;flex:none;font-style:normal;text-transform:none;letter-spacing:0}
.tip:hover,.tip:focus{color:var(--accent);outline:none}
#tooltip{position:fixed;z-index:100;max-width:280px;background:var(--tip-bg);color:var(--tip-ink);font-size:11.5px;font-weight:400;line-height:1.4;padding:8px 10px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .1s;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#tooltip.show{opacity:1}

/* ---- common bits ---- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 12px;font-size:12.5px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.dates{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.date{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:11px;color:var(--muted)}
.date b{display:block;font-size:12.5px;color:var(--ink)}
.muted{color:var(--muted)}

/* ---- keeper planner ---- */
.teamhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.teamhead h2{margin:0;font-size:17.5px}
.teamhead .tn{color:var(--muted);font-weight:500}
.calc{position:sticky;top:0;z-index:6;background:var(--bg);padding:8px 0 10px;margin:0 -2px;}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.stat{background:var(--panel);padding:8px 12px}
.stat .k{font-size:10.5px;color:var(--muted);display:flex;align-items:center}
.stat .v{font-size:17.5px;font-weight:700;font-variant-numeric:tabular-nums}
.stat.neg .v{color:var(--bad)}
.stat.hi .v{color:var(--accent)}
.status{margin-top:8px;border-radius:8px;padding:7px 12px;font-size:12.5px;display:flex;gap:6px;align-items:center}
.status.bad{background:var(--bad-soft);color:var(--bad)}
.status.warn{background:var(--warn-soft);color:var(--warn)}
.status.ok{background:var(--good-soft);color:var(--good)}
.status.idle{background:var(--chip);color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 10px}
.toggles{margin-left:auto;display:flex;gap:14px;flex-wrap:wrap}
label.tog{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);cursor:pointer}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 7px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
th.grp{border-left:1px solid var(--line)}
td.grp{border-left:1px solid var(--line)}
tr:last-child td{border-bottom:0}
tr.drop td{color:var(--muted)}
tr.kept td{background:var(--good-soft)}
td.player{white-space:normal;min-width:220px}
.nw{white-space:nowrap}
.pname{font-weight:600}
.pmeta{color:var(--muted);font-size:11px}
.badge{display:inline-block;font-size:9px;font-weight:700;border-radius:4px;padding:2px 6px;margin-left:6px;vertical-align:1px;white-space:nowrap;cursor:help}
.badge.drop{background:var(--bad-soft);color:var(--bad)}
.badge.ir{background:var(--warn-soft);color:var(--warn)}
.badge.last{background:var(--chip);color:var(--muted)}
.keep{appearance:none;width:22px;height:22px;border:2px solid var(--line);border-radius:6px;cursor:pointer;display:grid;place-content:center;background:var(--panel);margin:0}
.keep:checked{background:var(--good);border-color:var(--good)}
.keep:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.keep:disabled{opacity:.35;cursor:not-allowed}
.statcol{color:var(--ink);font-size:11.5px;padding-left:4px;padding-right:4px}
th.statcol{font-size:9.5px}
.next{display:block;font-size:10.5px;color:var(--muted);font-weight:500}
.mstat{display:none;margin-top:5px}
.mstat .pills{display:flex;flex-wrap:wrap;gap:3px}
.mstat .pill{font-size:10px;border-radius:5px;padding:1px 6px;background:var(--chip);font-variant-numeric:tabular-nums;white-space:nowrap}
.mstat .pill b{margin-left:3px}
td.h{font-weight:600}
.badge.cy{background:var(--chip);color:var(--muted)}
.badge.cy.fixed{background:var(--accent-soft);color:var(--accent)}
.legend{display:flex;gap:6px;align-items:center;font-size:10.5px;color:var(--muted);padding:8px 10px;border-top:1px solid var(--line)}
.legend i{display:inline-block;width:18px;height:12px;border-radius:3px}
.tname{font-size:11px;color:var(--muted);font-weight:500;margin-left:5px}
.arrow{color:var(--muted);margin:0 8px;font-weight:400}
.ov{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.ov a{display:block;padding:14px 16px;text-decoration:none;color:var(--ink)}
.ov a:hover{border-color:var(--accent)}
.ov b{display:block;margin-bottom:3px}
.ov span{color:var(--muted);font-size:12px}

/* ---- newsroom ---- */
.newslist{display:grid;gap:10px}
.newslist a{display:block;padding:16px 18px;text-decoration:none;color:var(--ink)}
.newslist a:hover{border-color:var(--accent)}
.newslist .kicker,.article .kicker{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.newslist b{display:block;font-size:16.5px;margin:4px 0 3px}
.newslist span{color:var(--muted);font-size:12.5px}
.ov a.lead{border-color:var(--accent);background:var(--accent-soft)}
.article{max-width:720px;padding:28px 34px 36px}
.article h1{display:block;font-size:30px;line-height:1.15;margin:6px 0 8px;letter-spacing:-.01em}
.article .dek{font-size:16px;color:var(--muted);margin:0 0 10px}
.article .byline{font-size:11.5px;color:var(--muted);padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:20px}
.article .body{font-size:13.5px;line-height:1.6}
.article .body h2{font-size:19.5px;margin:30px 0 8px}
.article .body h3{font-size:16px;margin:26px 0 6px}
.article .body p,.article .body li{margin:0 0 12px}
.article .body ul,.article .body ol{padding-left:22px}
.article .body hr{border:0;border-top:1px solid var(--line);margin:28px 0}
.article .body table{width:100%;font-size:11.5px;margin:0 0 16px;border-collapse:collapse}
.article .body th,.article .body td{vertical-align:top;padding:7px 6px;white-space:normal}
@media (max-width:760px){.article .body table{font-size:10.5px}.article .body th,.article .body td{padding:6px 3px}.article .body th{font-size:9px;letter-spacing:0}}
.article .body code{background:var(--chip);border-radius:4px;padding:1px 5px;font-size:.88em}
.back{display:inline-block;margin-bottom:12px;text-decoration:none;font-size:12.5px}
@media (max-width:760px){.article{padding:20px 16px 28px}.article h1{font-size:24px}.article .body{font-size:13px}}
tr.drop .statcol{color:var(--muted)}
body.hide-stats .statcol,body.hide-stats .statlegend{display:none}
.dnp{color:var(--muted);font-size:11px}

/* ---- rookie order ---- */
.ord{display:grid;gap:8px}
.pick{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 14px}
.pick .n{font-size:19.5px;font-weight:800;color:var(--accent);text-align:center}
.pick .who{font-weight:700;font-size:14px;display:flex;align-items:center}
.pick .how{color:var(--muted);font-size:11.5px}
.via{font-size:10.5px;font-weight:600;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 9px;white-space:nowrap}

/* ---- budgets ---- */
.band{position:relative;height:8px;background:var(--chip);border-radius:4px;min-width:120px}
.band i{position:absolute;top:-3px;width:3px;height:14px;background:var(--accent);border-radius:2px}
.band .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--muted);opacity:.5}
.pos{color:var(--good);font-weight:600}.negv{color:var(--bad);font-weight:600}

/* ---- trades ---- */
.trades{display:grid;gap:12px}
.trade{overflow:hidden}
.trade .head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.trade .title{font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.money{font-size:10.5px;font-weight:700;background:var(--good-soft);color:var(--good);border-radius:999px;padding:2px 9px}
.trade .d{color:var(--muted);font-size:11.5px;white-space:nowrap}
.swap{table-layout:fixed}
.swap th{width:50%;background:var(--panel)}
.swap th + th,.swap td + td{border-left:1px solid var(--line)}
.swap td{vertical-align:top;white-space:normal}
.swap ul{margin:0;padding:0;list-style:none}
.swap li{padding:2px 0}
.swap li.cash{color:var(--good);font-weight:600}
.swap li.pk{color:var(--accent);font-weight:600}

.case{margin-top:10px}
.case summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.case summary::-webkit-details-marker{display:none}
.case summary::before{content:"▸";color:var(--muted);transition:transform .15s}
.case[open] summary::before{transform:rotate(90deg)}
.case summary .nm{font-weight:700}
.cy{font-size:10.5px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--chip);color:var(--muted)}
.cy.rb{background:var(--accent-soft);color:var(--accent)}
.case table td{white-space:normal;font-size:12px}
#auditTable td{white-space:normal}
.case tr.bad td{background:var(--bad-soft)}
.case tr.warn td{background:var(--warn-soft)}
.case tr.ok td{background:var(--good-soft)}
#draftSummaryWrap{margin-bottom:16px}
#draftSummary td{white-space:nowrap}
#draftSummary tr.sel td{background:var(--accent-soft)}
#draftSummary a{cursor:pointer}
.badge.rk{background:var(--good-soft);color:var(--good)}
main table:not(.swap) thead th{cursor:pointer;user-select:none}
main table:not(.swap) thead th:hover{color:var(--ink)}
th.asc::after{content:" ▲";font-size:9px}
th.desc::after{content:" ▼";font-size:9px}
.mobile-nav{display:none}
@media (max-width:860px){
  .app,body.nav-collapsed .app{grid-template-columns:minmax(0,1fr)}
  nav.side,#openNav,body.nav-collapsed #openNav{display:none}
  body.nav-collapsed main{padding-left:16px}
  .mobile-nav{display:flex;position:sticky;top:0;z-index:8;height:46px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;padding:0 8px}
  .mobile-nav a{padding:12px 12px;white-space:nowrap;color:var(--muted);text-decoration:none;font-weight:600;font-size:12.5px;border-bottom:2px solid transparent}
  .mobile-nav a.on{color:var(--accent);border-bottom-color:var(--accent)}
  main{padding:16px 16px 50px}
  .calc{top:46px}
  .stats{grid-template-columns:repeat(3,1fr)}
  .stat .v{font-size:15px}
  .hide-sm,.statcol{display:none}
  body:not(.hide-stats) .mstat{display:block}
  th,td{padding:7px 6px}
}
</style>
</head>
<body>
<button class="iconbtn" id="openNav" aria-label="Show menu" title="Show menu">☰</button>
<div class="app">
  <nav class="side" aria-label="Sections">
    <div class="brand"><div><b>Church League</b><small id="seasonSmall"></small></div>
      <button class="iconbtn" id="closeNav" aria-label="Hide menu" title="Hide menu">‹</button></div>
    <ul id="sideNav"></ul>
    <div class="side-foot" id="foot"></div>
  </nav>
  <div>
    <div class="mobile-nav" id="mobileNav" role="tablist"></div>
    <main>
      <section id="overview">
        <h1>Church League 2026-27</h1>
        <div class="dates" id="dates"></div>
        <div class="ov" id="ovCards"></div>
      </section>

      <section id="news">
        <div id="newsView"></div>
      </section>

      <section id="rosters">
        <h1 id="rostersTitle"></h1>
        <div class="panel scroll" id="draftSummaryWrap"><table id="draftSummary"></table></div>
        <div class="chips" id="teamChips" role="tablist" aria-label="Teams"></div>
        <div id="teamView"></div>
      </section>

      <section id="rookies">
        <h1>Rookie draft order <span class="tip" tabindex="0" data-tip="Set by 2025-26 playoff finish. Picks 1-4: rookie-bracket finishers (champion first). 5-6: winner and loser of the 5th-place game. 7-10: 4th place, 3rd place, runner-up, champion. Every pick costs $1. Drafted players are listed with the pick; an arrow means the pick was traded.">?</span></h1>
        <div class="ord" id="rookieList"></div>
        <h2 class="sec">Pick trades</h2>
        <div class="trades" id="pickTrades"></div>
      </section>

      <section id="budgets">
        <h1>Auction budgets <span class="tip" tabindex="0" data-tip="Everyone starts at $200. Money traded last season moves the starting number. Every team must stay between $180 and $220. The trades behind each number are under Money trades.">?</span></h1>
        <div class="panel scroll"><table id="budgetTable"></table></div>
      </section>

      <section id="trades">
        <h1>Money trades <span class="tip" tabindex="0" data-tip="Every 2025-26 trade that moved 2026-27 auction money, from the Fantrax trade comments. If one is missing or wrong, tell Ryan before the auction.">?</span></h1>
        <div class="chips" id="tradeFilter"></div>
        <div class="trades" id="tradeList"></div>
      </section>
      <section id="audit">
        <h1>Contract audit <span class="tip" tabindex="0" data-tip="Players whose contract year in Fantrax didn't match what the rulebook gives them, rebuilt from every day of Fantrax roster history since 2022. Contract year = the season he must be dropped before. The league voted on 10/10/26 to restore the rulebook years, and Fantrax was corrected the same day.">?</span></h1>
        <div class="panel scroll"><table id="auditTable"></table></div>
        <div id="auditCases"></div>
      </section>
      <section id="archive">
        <h1>Archive <span class="tip" tabindex="0" data-tip="Earlier versions of league pages, frozen exactly as they were published.">?</span></h1>
        <div class="ov" id="archiveList"></div>
      </section>
    </main>
  </div>
</div>
<div id="tooltip" role="tooltip"></div>

2028, "flag": "bad", "note": "Corrected by league vote (10/10/26) to 2029"}]}, {"name": "Matas Buzelis", "owner": "Vaughn", "fantrax": 2027, "rulebook": 2028, "started": "2024-25 rookie", "cause": "on the waiver claim", "events": [{"date": "2024-10-22", "event": "Rookie draft pick (2024-25)", "owner": "Vaughn", "salary": 6, "contract": 2028, "flag": "", "note": "Contract starts: must be dropped before 2028"}, {"date": "2024-10-30", "event": "Dropped by Vaughn", "owner": "", "salary": 6, "contract": 2028, "flag": "", "note": ""}, {"date": "2024-11-09", "event": "Claimed by Chase off waivers", "owner": "Chase", "salary": 6, "contract": 2027, "flag": "", "note": ""}, {"date": "2024-11-09", "event": "Fantrax contract 2028 → 2027", "owner": "Chase", "salary": 6, "contract": 2027, "flag": "bad", "note": "Changed on the waiver claim"}, {"date": "2024-11-09", "event": "Dropped by Chase", "owner": "", "salary": 6, "contract": 2027, "flag": "", "note": ""}, {"date": "2025-01-08", "event": "Claimed by Jordan off waivers", "owner": "Jordan", "salary": 6, "contract": 2027, "flag": "", "note": ""}, {"date": "2025-01-08", "event": "Dropped by Jordan", "owner": "", "salary": 6, "contract": 2027, "flag": "", "note": ""}, {"date": "2025-02-04", "event": "Re-claimed by Jordan off waivers", "owner": "Jordan", "salary": 6, "contract": 2027, "flag": "", "note": ""}, {"date": "2025-02-26", "event": "Dropped by Jordan", "owner": "", "salary": 6, "contract": 2027, "flag": "", "note": ""}, {"date": "2025-03-04", "event": "Claimed by Vaughn off waivers", "owner": "Vaughn", "salary": 6, "contract": 2027, "flag": "", "note": ""}, {"date": "2025-03-23", "event": "End of 2024-25", "owner": "Vaughn", "salary": 6, "contract": 2027, "flag": "", "note": ""}, {"date": "2025-10-21", "event": "Kept for 2025-26", "owner": "Vaughn", "salary": 6, "contract": 2027, "flag": "warn", "note": "Keeper cost paid: $6"}, {"date": "2026-03-22", "event": "End of 2025-26", "owner": "Vaughn", "salary": 11, "contract": 2027, "flag": "", "note": ""}, {"date": null, "event": "Today (before keeper deadline)", "owner": "Vaughn", "salary": 11, "contract": 2027, "flag": "bad", "note": "Corrected by league vote (10/10/26) to 2028"}]}], "news": [{"slug": "2026-10-26_week2-predictions", "title": "Week 2 Picks: The Model Learns to Stream", "subtitle": "Week 1 went 2 for 5, and the misses all had the same cause. Here's the fix, and five new picks", "date": "2026-10-26", "desk": "The Analyst", "html": "<h2>First, the report card: 2 for 5<\/h2>\n<p>I said I'd grade myself. Here it is.<\/p>\n<table>\n<thead>\n<tr>\n<th>Matchup<\/th>\n<th>My pick<\/th>\n<th>Result<\/th>\n<th>Verdict<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Jake @ Jordan<\/td>\n<td>Jake 5-4 (55%)<\/td>\n<td><strong>Jordan 5-4<\/strong><\/td>\n<td>Miss<\/td>\n<\/tr>\n<tr>\n<td>Chase @ Brian<\/td>\n<td>Brian 6-3 (85%)<\/td>\n<td>Brian 6-2-1<\/td>\n<td>Hit<\/td>\n<\/tr>\n<tr>\n<td>Alex @ Adam<\/td>\n<td>Alex 5-4 (58%)<\/td>\n<td><strong>Adam 5-4<\/strong><\/td>\n<td>Miss<\/td>\n<\/tr>\n<tr>\n<td>Vaughn @ Yow<\/td>\n<td>Vaughn 6-3 (69%)<\/td>\n<td>Vaughn 8-1<\/td>\n<td>Hit<\/td>\n<\/tr>\n<tr>\n<td>Kendall @ Austin<\/td>\n<td>Kendall 5-4 (49%)<\/td>\n<td><strong>Austin 7-2<\/strong><\/td>\n<td>Miss<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Two winners out of five. My scoring was slightly better than a coin flip, and only because the two confident picks hit. A simple rule, \"pick the team with more projected starts,\" <strong>went 4 for 5 and beat me.<\/strong><\/p>\n<p>The misses had one cause. My model played Monday's roster all week, and you didn't. Across the league, the players on Monday's rosters produced almost exactly the games I projected, within two games for every team. <strong>The pickups decided the week.<\/strong> In-week adds produced 0 to 7 extra games by team:<\/p>\n<ul>\n<li><strong>Jordan: 7 games from pickups<\/strong>, the most. Aaron Gordon, Jalen Smith, Davion Mitchell, Matisse Thybulle and Precious Achiuwa turned a projected 33.5 starts into <strong>41 games played<\/strong>. Steals went from a projected 37 to 60. Jordan won 5-4.<\/li>\n<li><strong>Jake: 6.<\/strong> Five claims in one week, against 17 all of last season. Jake also used IR as a turnstile: Embiid in on Friday and out on Saturday, Kyrie and Flagg in on Saturday.<\/li>\n<li><strong>Brian and Chase: 5 each. Austin and Yow: 3. Alex: 2. Adam and Vaughn: 1. Kendall: 0.<\/strong><\/li>\n<\/ul>\n<p>Austin's three pickups covered Banchero's ankle the same day it happened, and Austin beat Kendall 7-2. That's the 1 seed's formula from last year, and I ignored it.<\/p>\n<p>Vaughn-Yow is the useful counterexample. Yow played <strong>four more games<\/strong> (35 to 31) and lost <strong>8-1<\/strong>: 477 points, or 13.6 a game, against a projected 17. More games don't help if they're bad games.<\/p>\n<p><strong>The fix:<\/strong> each manager now gets expected extra games from pickups, based on Week 1 and last season's claims. Re-run on Week 1 with only last season's habits, the new version goes <strong>4 for 5<\/strong>, and its scoring error drops by more than a third. It also brings IR players back when their return date is inside the week; Bam and Curry were both activated within two days in Week 1.<\/p>\n<h2>The picks<\/h2>\n<p>Week 2 is a full seven days with 49 games, and Wednesday is the big one: <strong>12 games<\/strong>. Thursday has three.<\/p>\n<table>\n<thead>\n<tr>\n<th>Matchup<\/th>\n<th>Pick<\/th>\n<th>Categories<\/th>\n<th>Win chance<\/th>\n<th>Projected games<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Jordan @ Chase<\/td>\n<td><strong>Jordan<\/strong><\/td>\n<td><strong>5-4<\/strong><\/td>\n<td>78%<\/td>\n<td>42.6 to 37.7<\/td>\n<\/tr>\n<tr>\n<td>Jake @ Alex<\/td>\n<td><strong>Jake<\/strong><\/td>\n<td><strong>5-4<\/strong><\/td>\n<td>75%<\/td>\n<td>36.9 to 38.1<\/td>\n<\/tr>\n<tr>\n<td>Brian @ Vaughn<\/td>\n<td><strong>Brian<\/strong><\/td>\n<td><strong>6-3<\/strong><\/td>\n<td>79%<\/td>\n<td>39.8 to 33.4<\/td>\n<\/tr>\n<tr>\n<td>Adam @ Kendall<\/td>\n<td><strong>Kendall<\/strong><\/td>\n<td><strong>5-4<\/strong><\/td>\n<td>72%<\/td>\n<td>37.5 to 39.3<\/td>\n<\/tr>\n<tr>\n<td>Yow @ Austin<\/td>\n<td><strong>Yow<\/strong><\/td>\n<td><strong>5-4<\/strong><\/td>\n<td>69%<\/td>\n<td>41.4 to 42.4<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>\"Categories\" is the most likely winning score. \"Win chance\" leaves out tied weeks (2-3%). \"Projected games\" includes expected pickups.<\/em><\/p>\n<hr />\n<h3>Jordan (LeBrontourage) @ Chase (Go Basketball): <strong>Jordan, 5-4<\/strong><\/h3>\n<p>This is the mirror-image matchup the preview promised. Jordan's build was 1st in threes and FT% and 10th in rebounds, blocks, FG% and turnovers; Chase's was the exact opposite. Eight of the nine categories are close to settled:<\/p>\n<ul>\n<li><strong>Jordan:<\/strong> points, threes, assists (100% each), FT% (99%).<\/li>\n<li><strong>Chase:<\/strong> turnovers (100%), FG% (98%), blocks (97%), rebounds (96%).<\/li>\n<li><strong>The whole week is steals: Jordan 78%.<\/strong> Jordan's pickups ran heavy on steals specialists last week (Thybulle, Davion Mitchell) and finished with 60.<\/li>\n<\/ul>\n<p>The likeliest score is 5-4 Jordan (70% of simulations), and the next is 4-5 Chase (19%). Chase cut two centers for wings in Week 1, then picked up two more centers (Diabate, and Nurkic, now out at least four weeks). If Chase streams guards with active hands this week, this flips.<\/p>\n<h3>Jake (The Haliban) @ Alex (10th in power rankings): <strong>Jake, 5-4<\/strong><\/h3>\n<p>This is the one pick where the \"more games\" rule disagrees with me. Alex projects for slightly more games (38.1 to 36.9), and the model still likes Jake at 75%, because the talent gap is that big.<\/p>\n<ul>\n<li><strong>Jake:<\/strong> assists (98%), FT% (95%), threes (93%), points (88%), steals (61%).<\/li>\n<li><strong>Alex:<\/strong> rebounds (91%), blocks (88%), FG% (84%). The five-center build keeps doing its job even with <strong>Jalen Duren out<\/strong> (hamstring, re-evaluated in two weeks).<\/li>\n<li><strong>Turnovers are a coin flip<\/strong> (Alex 53%).<\/li>\n<\/ul>\n<p>Watch the bigs on both sides: Embiid (plantar fasciitis management), Edey (ankle management) and Zubac (sprained ankle, his coach called him unlikely to play) are all day-to-day. Cooper Flagg comes back off Jake's IR.<\/p>\n<h3>Brian (Pursuit of Yaxellence) @ Vaughn (Markkanen My Words): <strong>Brian, 6-3<\/strong><\/h3>\n<p>This is the biggest games gap of the week: <strong>39.8 to 33.4.<\/strong> Brian added five games through pickups last week. Vaughn added one, and left <strong>four lineup slots empty<\/strong>, the only team in the league that left any.<\/p>\n<ul>\n<li><strong>Brian:<\/strong> rebounds (100%), points (91%), threes (74%), blocks (73%), assists (64%).<\/li>\n<li><strong>Vaughn:<\/strong> turnovers (81%), FT% (61%), steals (52%).<\/li>\n<li><strong>FG% is a coin flip<\/strong> (53/47).<\/li>\n<\/ul>\n<p>Vaughn won 8-1 last week on SGA and Holmgren being SGA and Holmgren, so don't count it out. But that came against a team playing its Cleveland stars twice. This week, Brian is the team with the games.<\/p>\n<h3>Adam (Ball Is Life) @ Kendall (Kenda): <strong>Kendall, 5-4<\/strong><\/h3>\n<p>Kendall made zero claims last week, and the model doesn't need any to like Kendall here. It's a deep roster, there are seven days of games, and <strong>Kon Knueppel is due back from the hamstring<\/strong> (ESPN's estimate is Wednesday).<\/p>\n<ul>\n<li><strong>Kendall:<\/strong> assists (97%), rebounds (90%), points (86%), threes (84%), with steals (54%) and FG% (55%) leaning Kendall.<\/li>\n<li><strong>Adam:<\/strong> turnovers (91%), FT% (85%), blocks (78%).<\/li>\n<\/ul>\n<p>The likeliest scores are 4-5 (28%) and 3-6 (27%), from Adam's side. Adam was the other team with no claims last week, and Adam's best path is the same one that beat Alex: points ran 54 over projection in Week 1. One open item: Kendall has 13 players plus Knueppel on IR, which leaves <strong>an empty roster spot.<\/strong> It's a free stream.<\/p>\n<h3>Yow (El Niño Maravilla) @ Austin (Crossover Cringle): <strong>Yow, 5-4<\/strong><\/h3>\n<p>The commissioner gets picked to win, which looked unlikely last week. Coby White and Nic Claxton come off IR. The other side of that is that <strong>Jalen Williams was stretchered off Sunday<\/strong> with an ankle injury, and I give him a 5% chance to play any given game this week.<\/p>\n<ul>\n<li><strong>Yow:<\/strong> rebounds (93%), FG% (90%), blocks (78%), turnovers (72%), FT% (60%), steals (57%).<\/li>\n<li><strong>Austin:<\/strong> assists (84%), threes (78%), points (64%).<\/li>\n<\/ul>\n<p>Austin projects for one more game (42.4 to 41.4), so the \"more games\" rule takes Austin. Austin now has <strong>Banchero (high-ankle sprain, four to six weeks) and Porzingis (out indefinitely)<\/strong> in both IR slots, so the next injury costs a real roster spot. Austin is the best streamer in the league, and this is the pick most likely to get streamed out from under me.<\/p>\n<hr />\n<h2>Habit watch<\/h2>\n<p>I'm tracking six manager habits this week and will grade them next Monday. Two of them:<\/p>\n<ul>\n<li><strong>Does Jake keep streaming?<\/strong> Five claims in Week 1 after 17 all of last season. I have it at 50/50 that Jake makes three or more again.<\/li>\n<li><strong>Austin under pressure:<\/strong> with both IR slots full, does Austin still make three or more claims? I say yes, at 65%.<\/li>\n<\/ul>\n<h2>How to read this<\/h2>\n<ul>\n<li>Win chances are the share of 20,000 simulated weeks each team won (<code>scripts/week_matchups.py<\/code>, method v2; packet <code>newsroom/packets/2026-10-26_week2_matchups.csv<\/code>).<\/li>\n<li>Each player's chance to play comes from today's ESPN injury report (<code>2026-10-26_week2_availability.csv<\/code>). Expected pickups by team are in <code>2026-10-26_week2_streaming.csv<\/code>.<\/li>\n<li>New in v2: projections themselves can be wrong. Every simulated week, each player runs a little hot or cold, which widens the spread.<\/li>\n<\/ul>"}, {"slug": "2026-10-26_injury-check", "title": "Is Everyone Hurt? Not More Than Usual. Just Later.", "subtitle": "The group chat says this is the most injured start in years. Five seasons of opening weeks say otherwise, with one twist that matters for your roster", "date": "2026-10-26", "desk": "The Analyst", "html": "<p>The group chat has a theory: there are more injuries than usual this year. It's a fair theory. In the first six days, Banchero went down for four to six weeks, Duren for at least two, Jalen Williams left on a stretcher Sunday, and IR slots across the league filled up. So I checked it.<\/p>\n<h2>The test<\/h2>\n<p>Take every player on a Church League roster on opening night, about 145-153 a season. For each team game in the season's first six days, ask whether he played. Do that for each of the last five seasons. This is our league's version of the injury question: not \"how many NBA players are hurt,\" but <strong>\"how many games did the players we actually roster miss?\"<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Season<\/th>\n<th>Opener<\/th>\n<th>Rostered players<\/th>\n<th>Team games missed<\/th>\n<th>Players who missed any<\/th>\n<th>Missed every game<\/th>\n<th>On fantasy IR, opening night<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>2022-23<\/td>\n<td>10/18<\/td>\n<td>145<\/td>\n<td>35 of 386 (<strong>9.1%<\/strong>)<\/td>\n<td>18<\/td>\n<td>7<\/td>\n<td>8<\/td>\n<\/tr>\n<tr>\n<td>2023-24<\/td>\n<td>10/24<\/td>\n<td>153<\/td>\n<td>41 of 407 (<strong>10.1%<\/strong>)<\/td>\n<td>21<\/td>\n<td>7<\/td>\n<td>13<\/td>\n<\/tr>\n<tr>\n<td>2024-25<\/td>\n<td>10/22<\/td>\n<td>144<\/td>\n<td>47 of 389 (<strong>12.1%<\/strong>)<\/td>\n<td>21<\/td>\n<td>11<\/td>\n<td>4<\/td>\n<\/tr>\n<tr>\n<td>2025-26<\/td>\n<td>10/21<\/td>\n<td>150<\/td>\n<td>65 of 418 (<strong>15.6%<\/strong>)<\/td>\n<td>31<\/td>\n<td>16<\/td>\n<td>14<\/td>\n<\/tr>\n<tr>\n<td><strong>2026-27<\/strong><\/td>\n<td><strong>10/20<\/strong><\/td>\n<td><strong>148<\/strong><\/td>\n<td><strong>39 of 426 (9.2%)<\/strong><\/td>\n<td><strong>24<\/strong><\/td>\n<td><strong>7<\/strong><\/td>\n<td><strong>8<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>The verdict: no.<\/strong> This year's opening week ranks among the healthiest of the five. Our rostered players missed 9.2% of their team games, about the same as 2022-23 and well below last season's 15.6%. Only seven players missed the entire week: Porzingis, Ingram, Butler, Coby White, Claxton, Knueppel and Dybantsa. Last year it was sixteen.<\/p>\n<p>The stars have been even healthier. Of the 18 players bought for $25 or more in this year's auction, <strong>none missed a game.<\/strong> In each of the three previous seasons, three or four big buys did.<\/p>\n<h2>So why does it feel worse?<\/h2>\n<p>Because of <strong>when<\/strong> the injuries happened. Last year's opening-week absences were mostly known before the season started: Tatum, Haliburton, Kyrie, Paul George and Jalen Williams were all out before tip-off, everyone drafted around them, and you knew on draft night.<\/p>\n<p>This year, <strong>15 of the 24 players who missed time played their team's opener and then went down mid-week.<\/strong> That's the most of any of the five seasons:<\/p>\n<table>\n<thead>\n<tr>\n<th>Season<\/th>\n<th>Played the opener, then missed a game<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>2022-23<\/td>\n<td>8<\/td>\n<\/tr>\n<tr>\n<td>2023-24<\/td>\n<td>11<\/td>\n<\/tr>\n<tr>\n<td>2024-25<\/td>\n<td>7<\/td>\n<\/tr>\n<tr>\n<td>2025-26<\/td>\n<td>13<\/td>\n<\/tr>\n<tr>\n<td><strong>2026-27<\/strong><\/td>\n<td><strong>15<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>This year's mid-week list: Banchero, Duren, Embiid, Kyrie, Flagg, Curry, LeBron, Kawhi, Ausar Thompson, Edgecombe, Edey, VanVleet, Keegan Murray, Mikel Brown and Jose Alvarado. A mid-week injury costs more in a head-to-head league than a preseason one, because it lands in the middle of a matchup you already set a lineup for. That's the feeling in the chat, and it's real. <strong>There aren't more injuries. More of them are surprises.<\/strong><\/p>\n<h2>How bad are they?<\/h2>\n<p>Mostly not bad. Of the 15 mid-week injuries, most are listed day-to-day, have an ESPN return estimate inside this week, or are already off the report. The ones that will last, plus Sunday's scare:<\/p>\n<ul>\n<li><strong>Paolo Banchero<\/strong> (Austin): high-ankle sprain, four to six weeks.<\/li>\n<li><strong>Jalen Duren<\/strong> (Alex): hamstring strain, re-evaluated in two weeks.<\/li>\n<li><strong>Jalen Williams<\/strong> (Yow): stretchered off Sunday with a left ankle injury. No timeline yet.<\/li>\n<\/ul>\n<p>Two players picked up during the week are also out long-term: <strong>Jusuf Nurkic<\/strong> (Chase; plantar plate tear, at least four weeks) and <strong>Yves Missi<\/strong> (Brian; bone bruise, \"extended period\").<\/p>\n<p>History gives a baseline for how many of these linger. In the four previous seasons, opening-week absences were still out two weeks later about half the time: 9 of 18, 8 of 21, 14 of 21, 15 of 31. This year's mix is weighted toward short stuff, so I'd expect fewer to linger. Still, three or four of them will.<\/p>\n<h2>What it means for the fantasy season<\/h2>\n<p><strong>1. IR slots are already the scarce resource.<\/strong> Five teams have both IR slots full: Alex (Duren, Dybantsa), Austin (Banchero, Porzingis), Chase (Butler, Nurkic), Jake (Flagg, Suggs) and Yow (Coby White, Claxton). Jake and Yow should get slots back this week (Flagg, Coby White and Claxton are due back), but Alex, Austin and Chase are holding long-term injuries. For them, the next injury means dropping someone. Austin is the cleanest example, with both slots holding long-term injuries, and Austin is also the league's heaviest streamer. That's the collision to watch.<\/p>\n<p><strong>2. Streaming is worth more than usual.<\/strong> Mid-week injuries are exactly what pickups fix. In Week 1, every IR move that came with a pickup happened the same day, and the teams that streamed beat their projections by 2.5 to 7.5 games. Jordan's seven extra games won a 5-4 week. Teams that don't use the wire (Kendall and Adam had zero claims, and Vaughn left four lineup slots empty) absorb every injury at full price.<\/p>\n<p><strong>3. Bigs are taking the hits.<\/strong> Duren, Nurkic, Missi, Porzingis and Claxton are all out, and Embiid, Edey and Zubac are day-to-day. That hurts the center-heavy builds, Alex's five centers and Chase's eight, and it means rebounds and blocks on the waiver wire will cost a little more than usual this month.<\/p>\n<p><strong>4. Big picture: it's early, and the stars are fine.<\/strong> Not one $25+ auction buy missed a game in the first six days. The title favorites from the preview haven't lost a core piece for more than a few days. The season outlook from the preview stands. What changed is the cost of a thin bench.<\/p>\n<h2>How to read this<\/h2>\n<ul>\n<li>\"Rostered\" means on a Church League roster (active, bench or IR) on opening night. Sources: FantraxDB <code>silver.roster_day<\/code> for 2022-25, and the live Fantrax roster for 2026.<\/li>\n<li>\"Missed\" means his NBA team played and he doesn't appear in ESPN's box score. That includes rest days and coach's decisions, not just injuries, which is why it's a fair comparison across seasons rather than an injury count. 7-17 players a season couldn't be matched to a box score team and were assigned their current NBA team.<\/li>\n<li>\"Two weeks later\" means he missed at least 75% of team games on days 7-21 of that season.<\/li>\n<li>Packet: <code>newsroom/packets/2026-10-26_injury_history.json<\/code> (season totals) and <code>2026-10-26_injury_history_players.csv<\/code> (every player).<\/li>\n<\/ul>"}, {"slug": "2026-10-19_week1-predictions", "title": "Week 1 Picks: Six Days, 43 Games, Two Dead Days", "subtitle": "A winner and a category score for all five matchups, and why Chase's eight centers can't all play on the same night", "date": "2026-10-19", "desk": "The Analyst", "html": "<p>Week 1 is short and lopsided. It's six days, but Tuesday has three games and Thursday has two, so it's really a Wednesday-Friday-Saturday-Sunday week. Most NBA teams play three times. <strong>Philadelphia plays four.<\/strong> Denver, Boston, Cleveland, Phoenix and Portland play only <strong>two<\/strong>. That means two Jokic games, two Tatum games and two Donovan Mitchell games. It shows up below.<\/p>\n<h2>The picks<\/h2>\n<table>\n<thead>\n<tr>\n<th>Matchup<\/th>\n<th>Pick<\/th>\n<th>Categories<\/th>\n<th>Win chance<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Jake @ Jordan<\/td>\n<td><strong>Jake<\/strong><\/td>\n<td><strong>5-4<\/strong><\/td>\n<td>55%<\/td>\n<\/tr>\n<tr>\n<td>Chase @ Brian<\/td>\n<td><strong>Brian<\/strong><\/td>\n<td><strong>6-3<\/strong><\/td>\n<td>85%<\/td>\n<\/tr>\n<tr>\n<td>Alex @ Adam<\/td>\n<td><strong>Alex<\/strong> (upset)<\/td>\n<td><strong>5-4<\/strong><\/td>\n<td>58%<\/td>\n<\/tr>\n<tr>\n<td>Vaughn @ Yow<\/td>\n<td><strong>Vaughn<\/strong><\/td>\n<td><strong>6-3<\/strong><\/td>\n<td>69%<\/td>\n<\/tr>\n<tr>\n<td>Kendall @ Austin<\/td>\n<td><strong>Kendall<\/strong><\/td>\n<td><strong>5-4<\/strong><\/td>\n<td>49% (Austin 46%)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>\"Categories\" is the most likely winning score. \"Win chance\" leaves out tied weeks, which happen 2-5% of the time.<\/em><\/p>\n<hr />\n<h3>Jake (The Haliban) @ Jordan (LeBrontourage): <strong>Jake, 5-4<\/strong><\/h3>\n<p>The preseason favorite opens against the league's most extreme build, and he does it with two Jokic games. Jake also gets two from Tatum and two from Lillard, and <strong>Bam Adebayo is on his IR<\/strong> with a groin issue (he practiced Sunday). Jordan gets about two more starts (33.5 to 31.4), mostly from LeBron's four Philly games.<\/p>\n<ul>\n<li><strong>Jake's side:<\/strong> points (62%), rebounds (66%), blocks (60%), FT% (70%) and turnovers (73%).<\/li>\n<li><strong>Jordan's side:<\/strong> threes (71%), assists (70%), steals (63%). The build is doing exactly what it was built to do.<\/li>\n<li><strong>The swing category is FG%, at 53/47.<\/strong><\/li>\n<\/ul>\n<p><strong>The IR twist:<\/strong> Curry is on Jordan's IR after Sunday's ankle tweak (\"expected to be fine\"). If both Bam and Curry are activated, this becomes a coin flip, 49% to 47%, and the most likely score flips to <strong>Jordan 5-4<\/strong>. Curry is worth 20 extra threes to Jordan this week. Whoever clears an IR slot first might win the week.<\/p>\n<h3>Chase (Go Basketball) @ Brian (Pursuit of Yaxellence): <strong>Brian, 6-3<\/strong><\/h3>\n<p>This is the least close matchup of the week. Brian gets four games each from Maxey and Jaylen Brown. Chase's eight centers run into a problem that doesn't show up in season-long projections: <strong>a daily lineup has room for only about four bigs.<\/strong> On the busy days, Chase's centers sit on the bench behind each other. He projects for <strong>28.5 starts to Brian's 33.0<\/strong>, the biggest gap in the league this week.<\/p>\n<ul>\n<li><strong>Chase locks:<\/strong> turnovers (100%) and FG% (92%).<\/li>\n<li><strong>Brian locks:<\/strong> points, threes and assists (100% each) and FT% (94%).<\/li>\n<li><strong>Toss-ups:<\/strong> blocks lean Chase (54%), steals are dead even (47/48). Rebounds go to <strong>Brian at 61%<\/strong>, because Wemby and Jalen Johnson out-rebound a center rotation that can't all play at once.<\/li>\n<\/ul>\n<p>Chase's best outcome is 4-5. To get there he needs blocks and steals, and he still has to steal rebounds.<\/p>\n<h3>Alex (10th in power rankings) @ Adam (Ball Is Life): <strong>Alex, 5-4, upset<\/strong><\/h3>\n<p>The preseason ninth-place team is the pick here, mostly because of the schedule. Adam projects for only <strong>27.4 starts<\/strong>, the fewest in the league: Mobley and Booker play twice, and Franz Wagner's shoulder is questionable. Alex gets 30.3, even with Derrick White, Clingan and Jarrett Allen on two-game teams.<\/p>\n<ul>\n<li><strong>Alex's side:<\/strong> rebounds (99%), blocks (83%) and FG% (82%), all from his five-center core. Assists (60%) and steals (53%) lean his way.<\/li>\n<li><strong>Adam's side:<\/strong> threes (77%), FT% (87%), turnovers (68%) and points (57%).<\/li>\n<\/ul>\n<p>That makes it five to four, and Alex's two coin-flip categories decide it.<\/p>\n<h3>Vaughn (Markkanen My Words) @ Yow (El Niño Maravilla): <strong>Vaughn, 6-3<\/strong><\/h3>\n<p>Bad news for the commissioner. Yow's balanced build drew the worst schedule of any contender. <strong>Donovan Mitchell and James Harden get two games each<\/strong> (Cleveland), Pritchard gets two, and Coby White and Nic Claxton are both on IR. Vaughn gets 33.7 starts to Yow's 31.6, and VJ Edgecombe's four Philly games help.<\/p>\n<ul>\n<li><strong>Vaughn's side:<\/strong> points (81%), threes (80%), blocks (84%) and steals (70%), with SGA and Holmgren doing the heavy lifting.<\/li>\n<li><strong>Yow's side:<\/strong> rebounds (67%), FG% (72%) and turnovers (59%).<\/li>\n<li><strong>True coin flips:<\/strong> assists (53/45) and FT% (50/50). Those two decide whether this ends 6-3 or 5-4. Either way it's Vaughn.<\/li>\n<\/ul>\n<p>Holmgren (quad, questionable) is Yow's best hope: an OKC rest night or two would put points and blocks back in play.<\/p>\n<h3>Kendall (Kenda) @ Austin (Crossover Cringle): <strong>Kendall, 5-4, lowest confidence<\/strong><\/h3>\n<p>This one is 49% to 46%, and you can call it either way. Both teams project for about 28 starts. Austin is missing Porzingis (IR). Kendall has Kon Knueppel's hamstring (no timetable; I give him a 35% chance to play any given game).<\/p>\n<ul>\n<li><strong>Kendall's side:<\/strong> rebounds (99%), FG% (86%) and points (68%), with Luka, Giannis and Sabonis supplying it.<\/li>\n<li><strong>Austin's side:<\/strong> threes (80%), FT% (88%), assists (59%) and turnovers (57%). Turnovers is the surprise: Cade and Trae have short weeks too.<\/li>\n<li><strong>The decider:<\/strong> blocks (Austin 56%) and steals (Austin 50/45). Austin needs both, and his projection says he gets one.<\/li>\n<\/ul>\n<p>Last season's 1 seed against the Hornets fan, decided by a block here and a steal there. I'm going with the stars.<\/p>\n<hr />\n<h2>How to read this<\/h2>\n<ul>\n<li>Win chances are the share of 20,000 simulated weeks each team won. The simulation is in <code>scripts/week_matchups.py<\/code> and the packet is <code>newsroom/packets/2026-10-19_week1_matchups.csv<\/code>.<\/li>\n<li>Players named as questionable or day-to-day on Sunday's report play less often in the simulation (<code>2026-10-19_week1_availability.csv<\/code>). Rosters are as of Monday morning, including the weekend pickups (McCain, Caruso, Ajay Mitchell, Champagnie, Poeltl, Fears, Maluach, Drummond).<\/li>\n<li>Lineup moves this week will change these numbers, especially Bam and Curry coming off IR. The IR-activated version is in <code>2026-10-19_week1_matchups_ir_activated.csv<\/code>.<\/li>\n<\/ul>"}, {"slug": "2026-10-19_league-history", "title": "Ten for Ten", "subtitle": "The league turns ten, so The Historian opened the archive and came back with lists of ten: numbers, owners, records, names, rivalries, and things to watch in season ten", "date": "2026-10-19", "desk": "The Historian", "html": "<p>A few years ago, Jordan went to bed having won his matchup. Overnight, the NBA issued a stat correction, and he woke up to find the W had turned into an L. He named his next two teams \"F@%K The Stat Guy\" and \"F The Got Damn Stat Guy,\" and he won the title with the second one.<\/p>\n<p>The Historian is, unavoidably, a stat guy. Jordan, my apologies in advance. Every number below has been checked twice, and none of them will change overnight.<\/p>\n<p>Tuesday, Church League tips off its <strong>tenth season.<\/strong> Nine banners hang so far. Five different owners have won them, the league has gone through more than fifty team names, and one founding member has retired. One season ended with a pandemic, a semifinal frozen at 5-4 and a verdict the group chat still argues about.<\/p>\n<p>Ten seasons calls for lists of ten. There are seven of them below, plus a full reference archive at the bottom.<\/p>\n<hr />\n<h2>The nine banners<\/h2>\n<table>\n<thead>\n<tr>\n<th>Season<\/th>\n<th>Champion<\/th>\n<th>Team name<\/th>\n<th>Seed<\/th>\n<th>The final<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>2017-18<\/td>\n<td><strong>Austin<\/strong><\/td>\n<td>Size Doesn't Matter<\/td>\n<td>—<\/td>\n<td>over Vaughn<\/td>\n<\/tr>\n<tr>\n<td>2018-19<\/td>\n<td><strong>Yow<\/strong><\/td>\n<td>KAT Daddy's Brows and Beards<\/td>\n<td>1<\/td>\n<td>beat Vaughn 6-3<\/td>\n<\/tr>\n<tr>\n<td>2019-20<\/td>\n<td><strong>Chase<\/strong><\/td>\n<td>Go Basketball<\/td>\n<td>1<\/td>\n<td>never played; the season stopped with the semifinals in progress (see 10 Seasons)<\/td>\n<\/tr>\n<tr>\n<td>2020-21<\/td>\n<td><strong>Chase<\/strong><\/td>\n<td>Go Basketball<\/td>\n<td>1<\/td>\n<td>beat Jordan 5-4<\/td>\n<\/tr>\n<tr>\n<td>2021-22<\/td>\n<td><strong>Jordan<\/strong><\/td>\n<td>F The Got Damn Stat Guy<\/td>\n<td>3<\/td>\n<td>beat Austin 5-4<\/td>\n<\/tr>\n<tr>\n<td>2022-23<\/td>\n<td><strong>Chase<\/strong><\/td>\n<td>Go Basketball<\/td>\n<td>1<\/td>\n<td>beat Jordan 5-4<\/td>\n<\/tr>\n<tr>\n<td>2023-24<\/td>\n<td><strong>Brian<\/strong><\/td>\n<td>Goodie Mobley<\/td>\n<td>4<\/td>\n<td>beat Yow 8-1<\/td>\n<\/tr>\n<tr>\n<td>2024-25<\/td>\n<td><strong>Jordan<\/strong><\/td>\n<td>Injured Reserves<\/td>\n<td>6<\/td>\n<td>beat Brian 5-4<\/td>\n<\/tr>\n<tr>\n<td>2025-26<\/td>\n<td><strong>Yow<\/strong><\/td>\n<td>El Niño Maravilla<\/td>\n<td>4<\/td>\n<td>beat Brian 6-3<\/td>\n<\/tr>\n<tr>\n<td><strong>2026-27<\/strong><\/td>\n<td><strong>?<\/strong><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>The tally: Chase 3, Jordan 2, Yow 2, Austin 1, Brian 1.<\/strong><\/p>\n<hr />\n<h2>1. Ten numbers that explain the league<\/h2>\n<p><strong>0.<\/strong> Weeks in which a team won all nine categories. That's zero in 1,362 tries. A team has won eight categories 48 times, and in 35 of those weeks the one it lost was <strong>turnovers.<\/strong> The team that scores, passes and shoots the most has the ball the most, so it also gives it away the most. A perfect week means winning all of that while turning it over less than the team you're beating. Nobody has done it yet.<\/p>\n<p><strong>4 of 7.<\/strong> Finals that ended 5-4, out of the seven actually played. The title usually comes down to one category.<\/p>\n<p><strong>5.<\/strong> Different champions in nine seasons. Six owners have never won one.<\/p>\n<p><strong>6.<\/strong> Jordan's seed when he won the 2024-25 title. That's the lowest seed in the bracket, and no champion has come from lower.<\/p>\n<p><strong>92 minutes.<\/strong> How long Giannis Antetokounmpo spent on Alex's roster on January 10, 2020. Chase traded him to Alex at 8:40 AM, and at 10:12 AM Alex sent Giannis and LeBron to Kendall for Anthony Davis. That trade finished Kendall's super team (see 10 Seasons).<\/p>\n<p><strong>9 for 9.<\/strong> Austin's top-four finishes. Nine seasons, and he has never finished lower than 4th.<\/p>\n<p><strong>86-37-2.<\/strong> Austin's all-time regular-season record (.696), the best in the league by a wide margin.<\/p>\n<p><strong>26-97-2.<\/strong> Jake's all-time regular-season record (.216). Over the last three seasons it's 3-40-1.<\/p>\n<p><strong>1,111.<\/strong> The most points any team has scored in a seven-day week, by Yow's 2023-24 team. That same team also holds the record for turnovers in a week, which is the 9-0 problem from the first item.<\/p>\n<p><strong>53.<\/strong> Distinct end-of-season team names on Fantrax since 2018. Chase has used one of them.<\/p>\n<hr />\n<h2>2. Ten owners, ten facts<\/h2>\n<p><strong>Austin: the most consistent.<\/strong> He has never finished lower than 4th and has finished 3rd five times. He won the first season on record (2017-18) with \"Size Doesn't Matter,\" and hasn't won since. Most years, the owner standing in his way has been Jordan.<\/p>\n<p><strong>Jordan: the closer.<\/strong> He has four finals appearances, the most in the league, and a 9-6-2 record in championship-bracket games. Both of his titles came from outside the top two seeds. He finished 9th in 2018-19, so the closer took a few years to arrive.<\/p>\n<p><strong>Chase: either the best team or the worst one.<\/strong> Three titles and three last-place finishes. In order: 10th, 10th, champion, champion, 10th, champion. All three titles came as the #1 seed, and his 7-3 record in championship-bracket games is the best winning percentage in the league.<\/p>\n<p><strong>Yow (the commissioner): the biggest swings.<\/strong> He has two titles, a 15-3 season (still the most regular-season wins) and a 3-13 season. Over the last four years he went 9th, then 2nd, then 6th, then champion.<\/p>\n<p><strong>Brian: three straight finals.<\/strong> He won in 2023-24, beating Yow 8-1, the most lopsided final ever played. Then he lost the next two finals. His .560 category win rate is the best in league history.<\/p>\n<p><strong>Vaughn: the bridesmaid.<\/strong> He was runner-up in each of the first three seasons on record. Since then he has finished 9th, 5th, 5th, 6th, 9th and 9th, and he's still looking for his first title.<\/p>\n<p><strong>Kendall: the steady middle, and the super team.<\/strong> In nine seasons he has never finished in the top three and never finished last. He has finished 7th four times. But in 2019-20 he built what may still be the most stacked roster in league history, and the pandemic stopped his playoff run one category short (see 10 Seasons).<\/p>\n<p><strong>Alex: the longest-running name.<\/strong> He has been \"10th in power rankings\" for seven straight seasons and has never actually finished 10th in the regular season. Last spring he won the rookie bracket and turned it into AJ Dybantsa, the #1 overall pick.<\/p>\n<p><strong>Adam: the newest owner.<\/strong> He took Mark's seat in 2021-22 and went 11-4-1 as the #2 seed in his first year. He lost the semifinal 5-4 to the eventual champion.<\/p>\n<p><strong>Jake: the long rebuild.<\/strong> His best finish is 5th, in the very first season on record. He has finished last four times and had the league's worst regular-season record in five of the eight Fantrax seasons. The Analyst picked him to win the title this year.<\/p>\n<p><em>Bonus fact, for the founding member:<\/em> <strong>Mark<\/strong> (2017-18 to 2020-21) finished 8th, 8th, 9th and 8th, called his 2018-19 team \"I Tried,\" and still holds a league record (see the next list).<\/p>\n<hr />\n<h2>3. Ten records in the book<\/h2>\n<p>The season marks cover the eight Fantrax seasons. The weekly marks count only standard seven-day regular-season weeks, so long All-Star weeks don't pad them.<\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Record<\/th>\n<th>Mark<\/th>\n<th>Holder<\/th>\n<th>When<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Most regular-season wins<\/td>\n<td><strong>15-3<\/strong><\/td>\n<td>Yow, KAT Daddy's Brows and Beards<\/td>\n<td>2018-19<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Best regular-season win %<\/td>\n<td><strong>13-2 (.867)<\/strong><\/td>\n<td>Jordan and Yow, both<\/td>\n<td>2023-24<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Points, one week<\/td>\n<td><strong>1,111<\/strong><\/td>\n<td>Yow, JoelADDonLukaBo okStephAntKPJJJ<\/td>\n<td>2023-24, wk 14<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Threes, one week<\/td>\n<td><strong>121<\/strong><\/td>\n<td>Yow (2023-24, wk 15) and Austin (2024-25, wk 7)<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Rebounds, one week<\/td>\n<td><strong>365<\/strong><\/td>\n<td>Chase, Go Basketball<\/td>\n<td>2020-21, wk 7<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Assists, one week<\/td>\n<td><strong>247<\/strong><\/td>\n<td>Austin, Crossover Cringle<\/td>\n<td>2025-26, wk 2<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>Steals, one week<\/td>\n<td><strong>70<\/strong><\/td>\n<td>Brian, Goodie Mobley<\/td>\n<td>2024-25, wk 7<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>Blocks, one week<\/td>\n<td><strong>60<\/strong><\/td>\n<td>Chase, Go Basketball<\/td>\n<td>2019-20, wk 5<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>FG%, one week<\/td>\n<td><strong>.603<\/strong><\/td>\n<td>Chase, Go Basketball<\/td>\n<td>2025-26, wk 3<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>FT%, one week<\/td>\n<td><strong>.932<\/strong><\/td>\n<td>Mark, America's Team<\/td>\n<td>2019-20, wk 4<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Chase has always built around big men.<\/strong> He holds the rebounds, blocks and FG% records, and the second-best mark in all three. This year he drafted eight centers.<\/p>\n<p><strong>Footnotes the record book can't leave out:<\/strong>\n- The most turnovers in a week (132) also belongs to Yow's 2023-24 team, the same team that holds the points record. Big weeks bring big turnover totals.\n- The fewest turnovers in a week (21) belongs to Alex. That same week his team made seven threes, so the Historian files it under a week when almost nobody played.\n- The worst regular season on record is Jake's 1-14 in 2023-24.<\/p>\n<hr />\n<h2>4. Ten seasons, one line each<\/h2>\n<p><strong>2017-18: The founding.<\/strong> Austin won the first banner with \"Size Doesn't Matter,\" and Vaughn finished runner-up. All of this comes from the commissioner's ledger, because Fantrax doesn't go back that far.<\/p>\n<p><strong>2018-19: Brows and Beards.<\/strong> Yow went 15-3, the most wins in league history, and beat Vaughn 6-3 in the final. Chase finished last for the second straight year.<\/p>\n<p><strong>2019-20: The unfinished season.<\/strong> Chase went from last place to 14-3 and the top seed. Kendall built a super team. The NBA shut down on March 11, with Chase and Kendall's semifinal frozen at 5-4. The record book gives Chase the title. The group chat is still split. It gets its own section below.<\/p>\n<p><strong>2020-21: The short season.<\/strong> In a 13-week regular season that started in December, Chase beat Jordan 5-4 in the final. That's the only back-to-back title in league history. Jake named his team \"We are NOT good\" and went 1-11-1.<\/p>\n<p><strong>2021-22: The Stat Guy's revenge.<\/strong> Yow and Adam were the top two seeds, and neither reached the final. Jordan, the 3 seed, survived a 4.5-4.5 tie against Vaughn in the first round, then won 5-4 and 5-4 to take the title.<\/p>\n<p><strong>2022-23: Chase again.<\/strong> Chase and Jordan met in the final for the second time in three years. It ended 5-4 again, and Chase won again, for his third title in four seasons.<\/p>\n<p><strong>2023-24: The Goodie Mobley upset.<\/strong> Jordan and Yow both went 13-2. Brian, the 4 seed, beat both of them in the playoffs, and he beat Yow 8-1 in the final.<\/p>\n<p><strong>2024-25: Injured Reserves.<\/strong> Brian went 12-3 and took the top seed. Jordan entered as the 6 seed at 7-7-1 and won three straight: over Kendall, then Austin, then Brian.<\/p>\n<p><strong>2025-26: El Niño.<\/strong> Austin went 12-2 and took the top seed. Yow, the 4 seed, beat Austin 8-1 in the semifinal and Brian 6-3 in the final. That was Brian's second straight loss in a final.<\/p>\n<p><strong>2026-27: Unwritten.<\/strong> Tip-off is Tuesday.<\/p>\n<hr />\n<h2>The unfinished season: 2019-20<\/h2>\n<p>The Historian doesn't rule on this one. Here's the evidence.<\/p>\n<p><strong>The super team.<\/strong> Kendall's \"King Freaky Donc\" finished the regular season 10-8, good for the 5 seed. What changed the team was four trades in 31 days, between December 11 and January 10:<\/p>\n<ul>\n<li><strong>Dec 11:<\/strong> Zion Williamson (who hadn't played an NBA game yet) and Deandre Ayton to Yow, for <strong>Karl-Anthony Towns<\/strong> and P.J. Washington.<\/li>\n<li><strong>Dec 12:<\/strong> Trae Young to Mark, for <strong>Bradley Beal<\/strong> and <strong>Zach LaVine.<\/strong><\/li>\n<li><strong>Jan 2:<\/strong> Klay Thompson (out for the whole season) to Mark, for <strong>Donovan Mitchell.<\/strong><\/li>\n<li><strong>Jan 10:<\/strong> Anthony Davis to Alex, for <strong>Giannis Antetokounmpo<\/strong> and <strong>LeBron James.<\/strong> Alex had gotten Giannis from Chase at 8:40 that morning, and he held him for 92 minutes.<\/li>\n<\/ul>\n<p>On the last day of the season, Kendall's roster had Giannis, LeBron, Luka Doncic, Towns, Beal, Siakam, Mitchell, LaVine, Porzingis and Middleton. He entered the playoffs as the 5 seed and beat Alex, the 3 seed (and the owner who sent him Giannis and LeBron), 6-3 in the first round.<\/p>\n<p><strong>The frozen semifinal.<\/strong> Chase (1) vs. Kendall (5), scheduled March 2-15, 2020. The NBA stopped on March 11, four days early, with Chase ahead 5-4:<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>PTS<\/th>\n<th>REB<\/th>\n<th>AST<\/th>\n<th>3PTM<\/th>\n<th>ST<\/th>\n<th>BLK<\/th>\n<th>FG%<\/th>\n<th>FT%<\/th>\n<th>TO<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Chase<\/td>\n<td>782<\/td>\n<td><strong>376<\/strong><\/td>\n<td>184<\/td>\n<td>51<\/td>\n<td><strong>72<\/strong><\/td>\n<td><strong>57<\/strong><\/td>\n<td><strong>.532<\/strong><\/td>\n<td>.704<\/td>\n<td><strong>101<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Kendall<\/td>\n<td><strong>1,189<\/strong><\/td>\n<td>361<\/td>\n<td><strong>237<\/strong><\/td>\n<td><strong>137<\/strong><\/td>\n<td>56<\/td>\n<td>34<\/td>\n<td>.453<\/td>\n<td><strong>.787<\/strong><\/td>\n<td>135<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Kendall won points by 407 and threes by 86. Chase led rebounds by <strong>15,<\/strong> and that was the swing category. In the other semifinal, Austin led Vaughn 7-2. The final was never played.<\/p>\n<p><strong>The case for Chase:<\/strong> He was 14-3, the #1 seed by three games, and he was winning when the music stopped. He also beat Kendall in both of their regular-season meetings, and both of those ended 5-4 too. They played three times that season, and Chase won all three by one category.<\/p>\n<p><strong>The case for Kendall:<\/strong> Four days were left with LeBron, Giannis and Luka on his roster, and he was down 15 rebounds. The super team was built for March. It never got a full March.<\/p>\n<p><strong>The verdict:<\/strong> The record book says Chase, with Vaughn 2nd, Austin 3rd and Kendall 4th. Fantrax says something else again. Its history page names Brian's \"Wiggin Out\" as champion. Brian was the 7th seed, and he won both of his rookie-bracket games that spring (8-1 and 7-1-1), so Fantrax apparently crowned the rookie-bracket winner. The group chat remains divided. Brian, if anyone asks, has a phantom banner on a server somewhere.<\/p>\n<hr />\n<h2>5. Ten team names worth remembering<\/h2>\n<ol>\n<li><strong>\"KAT Daddy's Brows and Beards\"<\/strong> (Yow, 2018-19). Went 15-3 and won the title, the best season any team name has been attached to.<\/li>\n<li><strong>\"We are NOT good\"<\/strong> (Jake, 2020-21). Went 1-11-1, so the name turned out to be right.<\/li>\n<li><strong>\"F@%K The Stat Guy\"<\/strong> and <strong>\"F The Got Damn Stat Guy\"<\/strong> (Jordan, 2020-21 and 2021-22). The second one won the title.<\/li>\n<li><strong>\"Definitely Not Jake's Team\"<\/strong> (Yow, 2020-21). Yow is 11-0 against Jake all-time, so the name holds up.<\/li>\n<li><strong>\"JoelADDonLukaBo okStephAntKPJJJ\"<\/strong> (Yow, 2023-24). The name was basically the roster. The team set three single-week records and lost the final 8-1.<\/li>\n<li><strong>\"Go Basketball\"<\/strong> (Chase, every season since 2018). Eight years, one name and three titles.<\/li>\n<li><strong>\"10th in power rankings\"<\/strong> (Alex, seven straight seasons). He has never finished 10th in the regular season.<\/li>\n<li><strong>Kendall's L's.<\/strong> \"Kendalllll\" had 5 L's, then 9, then 7, then 9 again. This year the team is just \"Kenda,\" with no L's at all.<\/li>\n<li><strong>\"Injured Reserves\" → \"Defending Champion\"<\/strong> (Jordan). He won the 2024-25 title as Injured Reserves and spent 2025-26 as \"Defending Champion.\" Yow won that season, so the name stopped being true in March.<\/li>\n<li><strong>\"Size Doesn't Matter\"<\/strong> (Austin, 2017-18). The first champion's name works three ways: a height joke in a sport where height is everything, a double entendre, and Austin's own nod to being a little under average height. It won the first banner in league history.<\/li>\n<\/ol>\n<p>The full name gallery is in the archive below.<\/p>\n<hr />\n<h2>6. Ten head-to-head facts<\/h2>\n<p>All-time head-to-head, every Fantrax matchup, regular season and playoffs.<\/p>\n<ol>\n<li><strong>Yow vs. Jake: 11-0.<\/strong> Jake has never beaten Yow.<\/li>\n<li><strong>Vaughn vs. Jake: 15-4-1.<\/strong> That's the most games won in any one-sided matchup in the league.<\/li>\n<li><strong>Yow vs. Kendall: 14-3.<\/strong><\/li>\n<li><strong>Austin vs. Jake: 13-2.<\/strong><\/li>\n<li><strong>Austin vs. Alex: 13-4.<\/strong><\/li>\n<li><strong>Brian vs. Jake: 12-2.<\/strong><\/li>\n<li><strong>Yow vs. Alex: 12-4-1.<\/strong><\/li>\n<li><strong>Austin vs. Jordan: 8-9-1 overall, but Jordan leads 3-1-1 in the playoffs.<\/strong> That includes the 2021-22 final, two semifinals and last spring's 4.5-4.5 third-place game, which Jordan won on the tiebreaker. Austin has made the top four every year, and Jordan has knocked him out three times.<\/li>\n<li><strong>Chase vs. Jordan in finals: 2-0.<\/strong> Both were 5-4 (2020-21 and 2022-23).<\/li>\n<li><strong>Chase vs. Kendall: 8-8-1.<\/strong> It's the most even long-running matchup in the league. But in 2019-20, Chase won all three of their meetings 5-4, and the last of those is the one Kendall still talks about.<\/li>\n<\/ol>\n<hr />\n<h2>7. Ten things to watch in season ten<\/h2>\n<ol>\n<li><strong>The first 9-0 week.<\/strong> It has never happened. Whoever does it first will have to win the turnover category too.<\/li>\n<li><strong>A #1 seed winning the title.<\/strong> It hasn't happened in three seasons.<\/li>\n<li><strong>Yow repeating.<\/strong> The only back-to-back champion so far is Chase, in 2019-20 and 2020-21, and Kendall would point out that the first of those is still disputed.<\/li>\n<li><strong>Brian's fourth straight final.<\/strong> Brian, Jordan and Vaughn have each made three straight. Nobody has made four.<\/li>\n<li><strong>Austin's top-four streak.<\/strong> He's 9 for 9. A tenth would make it every season in league history.<\/li>\n<li><strong>Chase's eight centers.<\/strong> He already holds the rebounds, blocks and FG% records. This roster could break his own marks.<\/li>\n<li><strong>Jake going from last to first.<\/strong> The Analyst picked him to win it all. Chase is the precedent: he finished last and won the title a year or two later.<\/li>\n<li><strong>Vaughn's first banner.<\/strong> He has been runner-up three times and has never won.<\/li>\n<li><strong>Kendall, Alex and Adam's first finals.<\/strong> None of them has played in one yet.<\/li>\n<li><strong>Fantrax naming the right champion.<\/strong> It credited the 2019-20 rookie-bracket winner with the title. This year the commissioner will check Fantrax's champion against the league's own bracket before the banner goes up.<\/li>\n<\/ol>\n<hr />\n<h2>The archive<\/h2>\n<h3>All-time standings<\/h3>\n<p>Final finish is the end-of-season order 1-10, playoffs and rookie bracket included. Records and category win rates cover the eight Fantrax seasons (2018-19 on). Bracket record counts only championship-bracket games.<\/p>\n<table>\n<thead>\n<tr>\n<th>Owner<\/th>\n<th>Seasons<\/th>\n<th>Titles<\/th>\n<th>Finals<\/th>\n<th>Top 3<\/th>\n<th>Avg finish<\/th>\n<th>Reg. season W-L-T<\/th>\n<th>Bracket W-L-T<\/th>\n<th>Category win %<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Austin<\/td>\n<td>9<\/td>\n<td>1<\/td>\n<td>2<\/td>\n<td><strong>7<\/strong><\/td>\n<td><strong>2.89<\/strong><\/td>\n<td><strong>86-37-2<\/strong><\/td>\n<td>9-8-1<\/td>\n<td>.559<\/td>\n<\/tr>\n<tr>\n<td>Jordan<\/td>\n<td>9<\/td>\n<td>2<\/td>\n<td><strong>4<\/strong><\/td>\n<td>5<\/td>\n<td>3.78<\/td>\n<td>74-47-4<\/td>\n<td><strong>9-6-2<\/strong><\/td>\n<td>.548<\/td>\n<\/tr>\n<tr>\n<td>Yow<\/td>\n<td>9<\/td>\n<td>2<\/td>\n<td>3<\/td>\n<td>5<\/td>\n<td>4.22<\/td>\n<td>75-49-1<\/td>\n<td>6-5-1<\/td>\n<td>.552<\/td>\n<\/tr>\n<tr>\n<td>Brian<\/td>\n<td>9<\/td>\n<td>1<\/td>\n<td>3<\/td>\n<td>3<\/td>\n<td>4.33<\/td>\n<td>72-52-1<\/td>\n<td>6-5-0<\/td>\n<td><strong>.560<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Vaughn<\/td>\n<td>9<\/td>\n<td>0<\/td>\n<td>3<\/td>\n<td>3<\/td>\n<td>5.44<\/td>\n<td>61-61-2<\/td>\n<td>2-4-1<\/td>\n<td>.507<\/td>\n<\/tr>\n<tr>\n<td>Chase<\/td>\n<td>9<\/td>\n<td><strong>3<\/strong><\/td>\n<td>3<\/td>\n<td>4<\/td>\n<td>5.56<\/td>\n<td>65-57-2<\/td>\n<td><strong>7-3-0<\/strong><\/td>\n<td>.507<\/td>\n<\/tr>\n<tr>\n<td>Adam<\/td>\n<td>5<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<td>6.40<\/td>\n<td>39-34-3<\/td>\n<td>1-3-0<\/td>\n<td>.496<\/td>\n<\/tr>\n<tr>\n<td>Kendall<\/td>\n<td>9<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<td>6.44<\/td>\n<td>50-72-3<\/td>\n<td>3-3-0<\/td>\n<td>.472<\/td>\n<\/tr>\n<tr>\n<td>Alex<\/td>\n<td>9<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<td>7.00<\/td>\n<td>52-73-0<\/td>\n<td>2-5-1<\/td>\n<td>.484<\/td>\n<\/tr>\n<tr>\n<td>Jake<\/td>\n<td>9<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<td>8.11<\/td>\n<td>26-97-2<\/td>\n<td>0-3-0<\/td>\n<td>.352<\/td>\n<\/tr>\n<tr>\n<td>Mark<\/td>\n<td>4<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<td>8.25<\/td>\n<td>14-35-0<\/td>\n<td>—<\/td>\n<td>.382<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>Category win % counts every category of every matchup, ties as half. V
