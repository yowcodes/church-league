<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Church League Keepers</title>
<meta name="description" content="Church League 2026-27 keeper planner: rosters, keeper costs, rookie draft order, auction budgets.">
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#15191e; --muted:#5f6b7a; --line:#e3e7ec;
  --accent:#1f5fbf; --accent-soft:#e8f0fc; --good:#1a7f4b; --good-soft:#e6f4ec;
  --bad:#b42318; --bad-soft:#fdecea; --warn:#9a5b00; --warn-soft:#fff4e0; --chip:#eef1f5;
  --tip-bg:#1f2630; --tip-ink:#f3f5f8; --shadow:0 1px 2px rgba(16,24,40,.06);
  --heat:26,127,75; --cold:180,35,24;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1318; --panel:#171c23; --ink:#e8ecf1; --muted:#9aa6b4; --line:#2a313b;
    --accent:#6ea1ff; --accent-soft:#1c2a42; --good:#4cc38a; --good-soft:#15291f;
    --bad:#ff7b72; --bad-soft:#3a1d1b; --warn:#f0b35a; --warn-soft:#33270f; --chip:#222933;
    --tip-bg:#e8ecf1; --tip-ink:#11161c; --shadow:none; --heat:76,195,138; --cold:255,123,114;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1318; --panel:#171c23; --ink:#e8ecf1; --muted:#9aa6b4; --line:#2a313b;
  --accent:#6ea1ff; --accent-soft:#1c2a42; --good:#4cc38a; --good-soft:#15291f;
  --bad:#ff7b72; --bad-soft:#3a1d1b; --warn:#f0b35a; --warn-soft:#33270f; --chip:#222933;
  --tip-bg:#e8ecf1; --tip-ink:#11161c; --shadow:none; --heat:76,195,138; --cold:255,123,114;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
button{font:inherit}

/* ---- layout + collapsible sidebar ---- */
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh;transition:grid-template-columns .15s}
body.nav-collapsed .app{grid-template-columns:0 minmax(0,1fr)}
nav.side{background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow:hidden;white-space:nowrap}
body.nav-collapsed nav.side{padding:0;border:0}
.brand{display:flex;justify-content:space-between;align-items:flex-start;padding:0 4px 0 8px}
.brand b{font-size:17px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:13px;margin-top:2px}
.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;width:30px;height:30px;cursor:pointer;display:grid;place-items:center;font-size:16px;line-height:1}
.iconbtn:hover{color:var(--accent);border-color:var(--accent)}
nav.side ul{list-style:none;margin:22px 0 0;padding:0}
nav.side a{display:block;padding:9px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
nav.side a:hover{background:var(--chip)}
nav.side a.on{background:var(--accent-soft);color:var(--accent)}
.side-foot{position:absolute;bottom:18px;left:22px;color:var(--muted);font-size:12px}
#openNav{position:fixed;top:14px;left:14px;z-index:20;display:none;box-shadow:var(--shadow)}
body.nav-collapsed #openNav{display:grid}
body.nav-collapsed main{padding-left:64px}
main{padding:24px 32px 60px;max-width:1180px;width:100%}
h1{font-size:24px;margin:0 0 16px;display:flex;align-items:center;gap:8px}
h2.sec{font-size:17px;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
section{display:none}
section.on{display:block}

/* ---- tooltips ---- */
.tip{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;border:1.5px solid currentColor;color:var(--muted);font-size:11px;font-weight:700;cursor:help;vertical-align:1px;margin-left:4px;flex:none;font-style:normal;text-transform:none;letter-spacing:0}
.tip:hover,.tip:focus{color:var(--accent);outline:none}
#tooltip{position:fixed;z-index:100;max-width:280px;background:var(--tip-bg);color:var(--tip-ink);font-size:13px;font-weight:400;line-height:1.4;padding:8px 10px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .1s;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#tooltip.show{opacity:1}

/* ---- common bits ---- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 12px;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.dates{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.date{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:12.5px;color:var(--muted)}
.date b{display:block;font-size:14px;color:var(--ink)}
.muted{color:var(--muted)}

/* ---- keeper planner ---- */
.teamhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.teamhead h2{margin:0;font-size:20px}
.teamhead .tn{color:var(--muted);font-weight:500}
.calc{position:sticky;top:0;z-index:6;background:var(--bg);padding:8px 0 10px;margin:0 -2px;}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.stat{background:var(--panel);padding:8px 12px}
.stat .k{font-size:12px;color:var(--muted);display:flex;align-items:center}
.stat .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.stat.neg .v{color:var(--bad)}
.stat.hi .v{color:var(--accent)}
.status{margin-top:8px;border-radius:8px;padding:7px 12px;font-size:14px;display:flex;gap:6px;align-items:center}
.status.bad{background:var(--bad-soft);color:var(--bad)}
.status.warn{background:var(--warn-soft);color:var(--warn)}
.status.ok{background:var(--good-soft);color:var(--good)}
.status.idle{background:var(--chip);color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 10px}
.toggles{margin-left:auto;display:flex;gap:14px;flex-wrap:wrap}
label.tog{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);cursor:pointer}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 7px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
th.grp{border-left:1px solid var(--line)}
td.grp{border-left:1px solid var(--line)}
tr:last-child td{border-bottom:0}
tr.drop td{color:var(--muted)}
tr.kept td{background:var(--good-soft)}
td.player{white-space:normal;min-width:220px}
.nw{white-space:nowrap}
.pname{font-weight:600}
.pmeta{color:var(--muted);font-size:12.5px}
.badge{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:2px 6px;margin-left:6px;vertical-align:1px;white-space:nowrap;cursor:help}
.badge.drop{background:var(--bad-soft);color:var(--bad)}
.badge.ir{background:var(--warn-soft);color:var(--warn)}
.badge.last{background:var(--chip);color:var(--muted)}
.keep{appearance:none;width:22px;height:22px;border:2px solid var(--line);border-radius:6px;cursor:pointer;display:grid;place-content:center;background:var(--panel);margin:0}
.keep:checked{background:var(--good);border-color:var(--good)}
.keep:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.keep:disabled{opacity:.35;cursor:not-allowed}
.statcol{color:var(--ink);font-size:13px;padding-left:4px;padding-right:4px}
th.statcol{font-size:11px}
.next{display:block;font-size:12px;color:var(--muted);font-weight:500}
.mstat{display:none;margin-top:5px}
.mstat .pills{display:flex;flex-wrap:wrap;gap:3px}
.mstat .pill{font-size:11.5px;border-radius:5px;padding:1px 6px;background:var(--chip);font-variant-numeric:tabular-nums;white-space:nowrap}
.mstat .pill b{margin-left:3px}
td.h{font-weight:600}
.badge.cy{background:var(--chip);color:var(--muted)}
.legend{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);padding:8px 10px;border-top:1px solid var(--line)}
.legend i{display:inline-block;width:18px;height:12px;border-radius:3px}
.tname{font-size:12.5px;color:var(--muted);font-weight:500;margin-left:5px}
.arrow{color:var(--muted);margin:0 8px;font-weight:400}
.ov{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.ov a{display:block;padding:14px 16px;text-decoration:none;color:var(--ink)}
.ov a:hover{border-color:var(--accent)}
.ov b{display:block;margin-bottom:3px}
.ov span{color:var(--muted);font-size:13.5px}
tr.drop .statcol{color:var(--muted)}
body.hide-stats .statcol,body.hide-stats .statlegend{display:none}
.dnp{color:var(--muted);font-size:12.5px}

/* ---- rookie order ---- */
.ord{display:grid;gap:8px}
.pick{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 14px}
.pick .n{font-size:22px;font-weight:800;color:var(--accent);text-align:center}
.pick .who{font-weight:700;font-size:16px;display:flex;align-items:center}
.pick .how{color:var(--muted);font-size:13px}
.via{font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 9px;white-space:nowrap}

/* ---- budgets ---- */
.band{position:relative;height:8px;background:var(--chip);border-radius:4px;min-width:120px}
.band i{position:absolute;top:-3px;width:3px;height:14px;background:var(--accent);border-radius:2px}
.band .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--muted);opacity:.5}
.pos{color:var(--good);font-weight:600}.negv{color:var(--bad);font-weight:600}

/* ---- trades ---- */
.trades{display:grid;gap:12px}
.trade{overflow:hidden}
.trade .head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.trade .title{font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.money{font-size:12px;font-weight:700;background:var(--good-soft);color:var(--good);border-radius:999px;padding:2px 9px}
.trade .d{color:var(--muted);font-size:13px;white-space:nowrap}
.swap{table-layout:fixed}
.swap th{width:50%;background:var(--panel)}
.swap th + th,.swap td + td{border-left:1px solid var(--line)}
.swap td{vertical-align:top;white-space:normal}
.swap ul{margin:0;padding:0;list-style:none}
.swap li{padding:2px 0}
.swap li.cash{color:var(--good);font-weight:600}
.swap li.pk{color:var(--accent);font-weight:600}

.case{margin-top:10px}
.case summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.case summary::-webkit-details-marker{display:none}
.case summary::before{content:"▸";color:var(--muted);transition:transform .15s}
.case[open] summary::before{transform:rotate(90deg)}
.case summary .nm{font-weight:700}
.cy{font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--chip);color:var(--muted)}
.cy.rb{background:var(--accent-soft);color:var(--accent)}
.case table td{white-space:normal;font-size:13.5px}
#auditTable td{white-space:normal}
.case tr.bad td{background:var(--bad-soft)}
.case tr.warn td{background:var(--warn-soft)}
.case tr.ok td{background:var(--good-soft)}
.mobile-nav{display:none}
@media (max-width:860px){
  .app,body.nav-collapsed .app{grid-template-columns:minmax(0,1fr)}
  nav.side,#openNav,body.nav-collapsed #openNav{display:none}
  body.nav-collapsed main{padding-left:16px}
  .mobile-nav{display:flex;position:sticky;top:0;z-index:8;height:46px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;padding:0 8px}
  .mobile-nav a{padding:12px 12px;white-space:nowrap;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;border-bottom:2px solid transparent}
  .mobile-nav a.on{color:var(--accent);border-bottom-color:var(--accent)}
  main{padding:16px 16px 50px}
  .calc{top:46px}
  .stats{grid-template-columns:repeat(3,1fr)}
  .stat .v{font-size:17px}
  .hide-sm,.statcol{display:none}
  body:not(.hide-stats) .mstat{display:block}
  th,td{padding:7px 6px}
}
</style>
</head>

      <section id="budgets">

      <section id="trades">

      </section>

        <div class="panel scroll"><table id="auditTable"></table></div>
        <div id="auditCases"></div>
      </section>
    </main>
  </div>
</div>
<div id="tooltip" role="tooltip"></div>

const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const dt = s => new Date(s);

// ---------- tooltips (hover on desktop, tap on phones) ----------
const tipEl = document.getElementById("tooltip");
let tipFor = null;
function showTip(el){
  tipFor = el; tipEl.textContent = el.dataset.tip; tipEl.classList.add("show");
  const r = el.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let x = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8);
  let y = r.bottom + 8; if (y + h > innerHeight - 8) y = r.top - h - 8;
  tipEl.style.left = x + "px"; tipEl.style.top = y + "px";
}
function hideTip(){ tipFor = null; tipEl.classList.remove("show"); }
document.addEventListener("mouseover", e => { const t = e.target.closest("[data-tip]"); if (t) showTip(t); });
document.addEventListener("mouseout", e => { if (e.target.closest("[data-tip]")) hideTip(); });
document.addEventListener("focusin", e => { const t = e.target.closest("[data-tip]"); if (t) showTip(t); });
document.addEventListener("focusout", hideTip);
document.addEventListener("click", e => { const t = e.target.closest("[data-tip]"); if (t) { tipFor === t ? hideTip() : showTip(t); } else hideTip(); });
addEventListener("scroll", hideTip, {passive:true});

// stats = [gp,fgm,fga,tpm,ftm,fta,pts,reb,ast,stl,blk,tov]
const CATS = [["PTS",6],["REB",7],["AST",8],["STL",9],["BLK",10],["3PM",3],["FG%","fg"],["FT%","ft"],["TO",11]];
const val = (s, k) => k === "fg" ? (s[2] ? s[1] / s[2] : 0) : k === "ft" ? (s[5] ? s[4] / s[5] : 0) : s[k] / s[0];
const show = (s, k) => (k === "fg" || k === "ft") ? val(s, k).toFixed(3).replace(/^0/, "") : val(s, k).toFixed(1);
// Rank each category against every rostered player with 10+ games. TO is reversed (fewer is better).
const POOL = DATA.teams.flatMap(t => t.players).filter(p => p.stats && p.stats[0] >= 10);
const SORTED = Object.fromEntries(CATS.map(([, k]) => [k, POOL.map(p => val(p.stats, k)).sort((a, b) => a - b)]));
function pctile(s, k){
  const arr = SORTED[k], v = val(s, k);
  let lo = 0; while (lo < arr.length && arr[lo] < v) lo++;
  const q = lo / arr.length;
  return k === 11 ? 1 - q : q;
}
const heat = (s, k) => {
  const q = pctile(s, k);
  return q >= .5 ? `background:rgba(var(--heat),${((q - .5) * 2 * .45).toFixed(2)})`
                 : `background:rgba(var(--cold),${((.5 - q) * 2 * .3).toFixed(2)})`;
};
function statCells(p){
  const s = p.stats;
  if (!s) return `<td class="statcol grp dnp" colspan="${CATS.length + 1}">Did not play in ${DATA.statsSeason}</td>`;
  return `<td class="num statcol grp">${s[0]}</td>` + CATS.map(([, k]) => `<td class="num statcol h" style="${heat(s, k)}">${show(s, k)}</td>`).join("");
}
function mobileStats(p){
  const s = p.stats;
  if (!s) return `<div class="mstat dnp">Did not play in ${DATA.statsSeason}</div>`;
  return `<div class="mstat"><div class="pills"><span class="pill">GP<b>${s[0]}</b></span>`
    + CATS.map(([c, k]) => `<span class="pill" style="${heat(s, k)}">${c}<b>${show(s, k)}</b></span>`).join("") + `</div></div>`;
}

function renderTeam(){
  const t = current, plan = getPlan(t);
  const keepSet = new Set(plan.keep.filter(id => t.players.some(p => p.id === id && !p.mustDrop)));
  const kept = t.players.filter(p => keepSet.has(p.id));
  const keeperCost = kept.reduce((s, p) => s + (p.cost || 0), 0);
  const rookie = plan.rookie ? 1 : 0;
  const left = t.budget - keeperCost - rookie * R.rookieCost;
  const spots = R.rosterSpots - kept.length - rookie;
  const maxBid = spots > 0 ? left - (spots - 1) : 0;
  const mustDrop = t.players.filter(p => p.mustDrop);

  const issues = [];
  if (left < 0) issues.push(["bad", `Keepers cost ${fmt(-left)} more than the auction budget.`]);
  if (spots < 0) issues.push(["bad", `${-spots} over the ${R.rosterSpots}-man roster.`]);
  if (left >= 0 && spots > 0 && left < spots) issues.push(["bad", `Not enough money to fill ${spots} spots at $1 each.`]);
  const irKept = kept.filter(p => p.ir);
  if (irKept.length) issues.push(["warn", `IR must be empty at keeper processing: ${irKept.map(p => p.name).join(", ")}.`]);
  let status;
  if (issues.length) status = issues[0].concat(issues.length > 1 ? [issues.slice(1).map(i => i[1]).join(" ")] : []);
  else if (kept.length) status = ["ok", `Valid plan: ${kept.length} keeper${kept.length > 1 ? "s" : ""}, ${fmt(left)} for ${spots} spot${spots === 1 ? "" : "s"}.`];
  else status = ["idle", "Check the players you'd keep."];

  const rows = t.players.map(p => {
    const on = keepSet.has(p.id);
    const badges = (p.mustDrop ? `<span class="badge drop" data-tip="Contract is up. He can't be kept and goes back into the auction pool.">MUST DROP</span>` : "")
      + (p.ir ? `<span class="badge ir" data-tip="On IR now. IR must be emptied when keepers are processed and stay empty through the auction.">IR</span>` : "")
      + (!p.mustDrop && p.contract ? `<span class="badge cy" data-tip="Contract year ${p.contract}: he must be dropped before the ${p.contract}-${String(p.contract + 1).slice(2)} season, so he can be kept through ${p.keepThrough}.">${p.contract}</span>` : "");
    return `<tr class="${p.mustDrop ? "drop" : on ? "kept" : ""}">
      <td><input type="checkbox" class="keep" data-id="${p.id}" ${on ? "checked" : ""} ${p.mustDrop ? "disabled" : ""} aria-label="Keep ${esc(p.name)}"></td>
      <td class="player"><span class="pname">${esc(p.name)}</span>${badges}<div class="pmeta">${[(p.pos || "").split(",").join("/"), p.nba, p.age ? "age " + p.age : ""].filter(Boolean).map(x => `<span class="nw">${esc(x)}</span>`).join(" · ")}</div>${mobileStats(p)}</td>
      <td class="num"><b>${p.mustDrop ? "-" : fmt(p.cost)}</b></td>
      ${statCells(p)}
    </tr>`;
  }).join("");

  document.getElementById("teamView").innerHTML = `
    <div class="teamhead"><h2>${esc(t.owner_name)} <span class="tn">· ${esc(t.team_name)}</span></h2>
      <span class="pmeta">${t.players.length} rostered · ${mustDrop.length} must drop</span></div>
    <div class="calc">
      <div class="stats">
        <div class="stat"><div class="k">Budget${tip("2026-27 auction budget: $200 plus or minus last season's money trades.")}</div><div class="v">${fmt(t.budget)}</div></div>
        <div class="stat"><div class="k">Keepers (${kept.length})</div><div class="v">${fmt(keeperCost)}</div></div>
        <div class="stat"><div class="k">Rookie pick${tip("Every rookie pick costs $1 and takes a roster spot. Turn off with the toggle below.")}</div><div class="v">${fmt(rookie * R.rookieCost)}</div></div>
        <div class="stat ${left < 0 ? "neg" : "hi"}"><div class="k">Left</div><div class="v">${fmt(left)}</div></div>
        <div class="stat ${spots < 0 ? "neg" : ""}"><div class="k">Open spots${tip("14 roster spots minus keepers minus the rookie pick.")}</div><div class="v">${spots}</div></div>
        <div class="stat"><div class="k">Max bid${tip("Most you can bid on one player while still leaving $1 for every other open spot.")}</div><div class="v">${spots > 0 && left > 0 ? fmt(maxBid) : "-"}</div></div>
      </div>
      <div class="status ${status[0]}">${esc(status[1])}${status[2] ? tip(status[2]) : ""}</div>
    </div>
    <div class="toolbar">
      <button class="btn" id="keepAll">Check all keepable</button>
      <button class="btn" id="clearAll">Clear</button>
      <button class="btn primary" id="copyPlan">Copy my plan</button>${tip("Copies a one-line summary of your keepers and money left, ready to paste in the group text.")}
      <span class="toggles">
        <label class="tog"><input type="checkbox" id="rookieTog" ${plan.rookie ? "checked" : ""}> Rookie pick</label>
        <label class="tog"><input type="checkbox" id="statsTog" ${showStats() ? "checked" : ""}> ${DATA.statsSeason} stats</label>
      </span>
    </div>
    <div class="panel scroll"><table>
      <thead><tr><th style="width:40px">Keep</th><th>Player</th>
        <th class="num">Cost${tip("Keeper price for 2026-27, as Fantrax shows it today.")}</th>
        <th class="num statcol grp">GP${tip(`${DATA.statsSeason} regular season. Per-game averages; FG% and FT% are season totals. Green/red shading ranks each stat against every rostered player (10+ games). TO is reversed: fewer is greener.`)}</th>
        ${CATS.map(([c]) => `<th class="num statcol">${c}</th>`).join("")}
      </tr></thead>
      <tbody>${rows}</tbody></table>
      <div class="legend statlegend">Weak <i style="background:rgba(var(--cold),.3)"></i><i style="background:var(--chip)"></i><i style="background:rgba(var(--heat),.45)"></i> Strong</div></div>`;

  const save = upd => { store.set(planKey(t), Object.assign(getPlan(t), upd)); renderTeam(); };
  document.querySelectorAll("#teamView .keep").forEach(cb => cb.addEventListener("change", () => {
    const s = new Set(getPlan(t).keep); cb.checked ? s.add(cb.dataset.id) : s.delete(cb.dataset.id); save({ keep: [...s] });
  }));
  document.getElementById("keepAll").onclick = () => save({ keep: t.players.filter(p => !p.mustDrop).map(p => p.id) });
  document.getElementById("clearAll").onclick = () => save({ keep: [] });
  document.getElementById("rookieTog").onchange = e => save({ rookie: e.target.checked });
  document.getElementById("statsTog").onchange = e => { store.set("showStats", e.target.checked); document.body.classList.toggle("hide-stats", !e.target.checked); };
  document.getElementById("copyPlan").onclick = async e => {
    const txt = `${t.owner_name} keepers (${kept.length}): ` + (kept.map(p => `${p.name} ${fmt(p.cost)}`).join(", ") || "none")
      + `\nKeepers ${fmt(keeperCost)} · Left for auction ${fmt(left)} · Open spots ${spots}`;
    try { await navigator.clipboard.writeText(txt); e.target.textContent = "Copied"; }
    catch(err){ prompt("Copy this:", txt); }
    setTimeout(() => { e.target.textContent = "Copy my plan"; }, 1500);
  };
}

// ---------- trades as "who gets what" tables ----------
function tradeCard({ title, date, money, sides, note }){
  const [a, b] = Object.keys(sides);
  const list = items => `<ul>${items.map(([cls, txt]) => `<li class="${cls}">${esc(txt)}</li>`).join("") || "<li class='muted'>-</li>"}</ul>`;
  return `<div class="panel trade">
    <div class="head"><span class="title">${esc(title)}${money ? `<span class="money">${esc(money)}</span>` : ""}${note ? tip(note) : ""}</span><span class="d">${day(date)}</span></div>
    <table class="swap"><thead><tr><th>${esc(a)} gets</th><th>${esc(b)} gets</th></tr></thead>
      <tbody><tr><td>${list(sides[a])}</td><td>${list(sides[b])}</td></tr></tbody></table></div>`;
}
function sidesFor(a, b, players){
  const sides = { [a]: [], [b]: [] };
  players.forEach(m => (sides[m.to] = sides[m.to] || []).push(["", m.player]));
  return sides;
}

// ---------- rookie order ----------
const teamOf = o => (DATA.teams.find(t => t.owner_name === o) || {}).team_name || "";
const ownerTag = o => `${esc(o)}<span class="tname">${esc(teamOf(o))}</span>`;
document.getElementById("rookieList").innerHTML = DATA.rookieOrder.map(r => `
  <div class="panel pick"><div class="n">${r.pick_no}</div>
    <div><div class="who">${r.holder !== r.original ? `${ownerTag(r.original)}<span class="arrow">→</span>${ownerTag(r.holder)}` : ownerTag(r.holder)}${r.note ? tip(r.note) : ""}</div>
    <div class="how">${esc(r.earned_by)}</div></div><span></span></div>`).join("");
document.getElementById("pickTrades").innerHTML = DATA.pickTrades.map(p => {
  const [a, b] = p.parties, sides = sidesFor(a, b, p.players);
  Object.entries(p.extras || {}).forEach(([o, items]) => items.forEach(x => sides[o].unshift([x.startsWith("$") ? "cash" : "pk", x])));
  return tradeCard({ title: `${a} ↔ ${b}`, date: p.date, sides, note: p.summary });
}).join("");

// ---------- budgets ----------
(function(){
  const rows = DATA.teams.map(t => {
    const sent = DATA.moneyTrades.filter(m => m.payer === t.owner_name).reduce((s, m) => s + m.amount, 0);
    const recv = DATA.moneyTrades.filter(m => m.receiver === t.owner_name).reduce((s, m) => s + m.amount, 0);
    return { t, sent, recv, pct: (t.budget - R.band[0]) / (R.band[1] - R.band[0]) * 100 };
  }).sort((a, b) => b.t.budget - a.t.budget);
  document.getElementById("budgetTable").innerHTML = `
    <thead><tr><th>Owner</th><th class="num">Start</th><th class="num">Received</th><th class="num">Sent</th><th class="num">2026-27</th><th class="hide-sm">$180 – $220${tip("Where each budget sits in the allowed range. The line marks $200.")}</th></tr></thead>
    <tbody>${rows.map(({t, sent, recv, pct}) => `<tr>
      <td><a href="#rosters/${encodeURIComponent(t.owner_name)}" class="pname">${esc(t.owner_name)}</a> <span class="pmeta">${esc(t.team_name)}</span></td>
      <td class="num">${fmt(R.baseBudget)}</td>
      <td class="num">${recv ? `<span class="pos">+${fmt(recv)}</span>` : "-"}</td>
      <td class="num">${sent ? `<span class="negv">-${fmt(sent)}</span>` : "-"}</td>
      <td class="num"><b>${fmt(t.budget)}</b></td>
      <td class="hide-sm"><div class="band"><span class="mid"></span><i style="left:calc(${pct}% - 1px)"></i></div></td></tr>`).join("")}</tbody>`;
})();

// ---------- money trades ----------
const tf = document.getElementById("tradeFilter");
tf.innerHTML = ["All", ...DATA.teams.map(t => t.owner_name)].map(o => `<button class="chip${o === "All" ? " on" : ""}" data-o="${esc(o)}">${esc(o)}</button>`).join("");
function renderTrades(owner){
  tf.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.o === owner));
  const list = DATA.moneyTrades.filter(m => owner === "All" || m.payer === owner || m.receiver === owner).slice().reverse();
  document.getElementById("tradeList").innerHTML = list.length ? list.map(m => {
    const sides = sidesFor(m.payer, m.receiver, m.players);
    sides[m.receiver].unshift(["cash", `${fmt(m.amount)} auction money`]);
    const note = [m.comment ? `Fantrax note: "${m.comment}"` : "", m.condition_text ? `Side bet: ${m.condition_text}. ${m.resolved_note || ""}` : ""].filter(Boolean).join("  ");
    return tradeCard({ title: `${m.payer} ↔ ${m.receiver}`, date: m.date, money: `${fmt(m.amount)} to ${m.receiver}`, sides, note });
  }).join("") : `<div class="panel trade"><div class="head muted">No money trades for ${esc(owner)}.</div></div>`;
}
tf.addEventListener("click", e => { const b = e.target.closest(".chip"); if (b) renderTrades(b.dataset.o); });
renderTrades("All");

// ---------- contract audit ----------
(function(){
  const A = DATA.audit || [];
  document.getElementById("auditTable").innerHTML = `
    <thead><tr><th>Player</th><th>Owner</th><th class="num">Fantrax</th><th class="num">Rulebook${tip("Contract year the rulebook gives him: auction or waiver pickup = start season + 3, rookie pick = + 4. Keeping, trades and waiver drops don't reset it.")}</th><th class="hide-sm">Started${tip("How and when his current contract began.")}</th><th>What changed it</th></tr></thead>
    <tbody>${A.map((c, i) => `<tr><td><a href="#audit" class="pname" data-case="${i}">${esc(c.name)}</a></td><td>${esc(c.owner)}</td>
      <td class="num">${c.fantrax}</td><td class="num"><b>${c.rulebook}</b></td><td class="hide-sm">${esc(c.started)}</td><td>${esc(c.cause || "-")}</td></tr>`).join("")}</tbody>`;
  document.getElementById("auditCases").innerHTML = A.map((c, i) => `
    <details class="panel case" id="case-${i}"><summary><span class="nm">${esc(c.name)}</span><span class="muted">${esc(c.owner)}</span>
      <span class="cy">Fantrax ${c.fantrax}</span><span class="cy rb">Rulebook ${c.rulebook}</span></summary>
      <div class="scroll"><table><thead><tr><th>Date</th><th>Event</th><th>Owner</th><th class="num">Salary</th><th class="num">Contract${tip("Contract year as Fantrax showed it at the time.")}</th><th>Note</th></tr></thead>
      <tbody>${c.events.map(e => `<tr class="${e.flag || ""}"><td>${e.date ? day(e.date) : "Now"}</td><td>${esc(e.event)}</td><td>${esc(e.owner)}</td>
        <td class="num">${e.salary != null ? "$" + e.salary : ""}</td><td class="num">${e.contract || ""}</td><td class="pmeta">${esc(e.note)}</td></tr>`).join("")}</tbody></table></div>
    </details>`).join("");
  document.getElementById("auditTable").addEventListener("click", e => {
    const a = e.target.closest("[data-case]"); if (!a) return;
    e.preventDefault(); const d = document.getElementById("case-" + a.dataset.case); d.open = true; d.scrollIntoView({behavior: "smooth", block: "start"});
  });
})();

route();
</script>
